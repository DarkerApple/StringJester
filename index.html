    this.cv.style.width=innerWidth+'px'; this.cv.style.height=innerHeight+'px';
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  grade2col:{perfect:'#ffe9b0',good:'#c8d8a8',early:'#9db3c8',late:'#c8a58e',
    miss:'#8e2f2a',still:'#b9c8e0',break:'#c03428'},
  grade2txt:{perfect:'PERFECT',good:'GOOD',early:'EARLY',late:'LATE',miss:'MISS',
    still:'STILL',break:'BROKEN'},

  render(S,tR){
    const ctx=this.ctx, pal=S.chart? S.chart.stage.palette : Chart.blank().stage.palette;
    ctx.fillStyle='#030308'; ctx.fillRect(0,0,L.W,L.H);
    const pull=S.fx.pullback;
    ctx.save();
    if(pull>0){ const s=1-0.22*U.smooth(pull);
      ctx.translate(L.cx,L.H*0.52); ctx.scale(s,s); ctx.translate(-L.cx,-L.H*0.52); }
    // ---------- the stage box ----------
    ctx.fillStyle=pal[0]||'#0d1018';
    ctx.fillRect(L.stageX0-30,L.stageTop-10,(L.stageX1-L.stageX0)+60,(L.lipY-L.stageTop)+14);
    Stage.drawFlats(S,ctx,'back');
    Stage.drawShadows(S,ctx);
    Stage.drawFlats(S,ctx,'mid');
    // stage floor boards
    this.floor(ctx,S,pal);
    Puppet.draw(ctx,S,pal);
    this.strings(ctx,S,pal,tR);
    Stage.drawFootlights(S,ctx);
    // darkness when the footlights fail
    const lv=Stage.lightLevel(S)*(1-Stage.dipAmount(S)*0.8);
    if(lv<0.98){ ctx.fillStyle=`rgba(2,3,7,${U.clamp((1-lv)*0.62,0,0.85)})`;
      ctx.fillRect(L.stageX0-30,L.stageTop-10,(L.stageX1-L.stageX0)+60,(L.lipY-L.stageTop)+14); }
    // stage lip board
    ctx.fillStyle='#0a0810';
    ctx.fillRect(0,L.lipY,L.W,L.H*0.045);
    ctx.fillStyle=U.rgba(pal[2]||'#d9a441',0.06*lv);
    ctx.fillRect(L.stageX0,L.lipY,L.stageX1-L.stageX0,3);
    ctx.restore();
    // ---------- Act V reveal: the strings above your own wrists ----------
    if(pull>0.02) this.reveal(ctx,S,pal,tR,pull);
    this.proscenium(ctx,S,pal);
    Audience.draw(ctx,S);
    this.surtitles(ctx,S,tR);
    this.crossbar(ctx,S,pal,tR);
    this.hud(ctx,S,tR);
    this.fx(ctx,S,tR);
    this.filmGrain(ctx,S,tR);
  },

  floor(ctx,S,pal){
    const y=L.floorAt(S.depth);
    const g=ctx.createLinearGradient(0,y-6,0,L.lipY);
    g.addColorStop(0,U.rgba('#000000',0)); g.addColorStop(1,U.rgba(pal[2]||'#d9a441',0.10));
    ctx.fillStyle=U.mix(pal[0]||'#10131d','#000000',0.25);
    ctx.fillRect(L.stageX0-30,y,(L.stageX1-L.stageX0)+60,L.lipY-y);
    ctx.fillStyle=g; ctx.fillRect(L.stageX0-30,y,(L.stageX1-L.stageX0)+60,L.lipY-y);
    ctx.strokeStyle=U.rgba('#000',0.35); ctx.lineWidth=1;
    for(let i=1;i<5;i++){ const yy=U.lerp(y,L.lipY,i/5);
      ctx.beginPath(); ctx.moveTo(L.stageX0-30,yy); ctx.lineTo(L.stageX1+30,yy); ctx.stroke(); }
  },

  /* ------- strings, pulses, twist helices, cue beads ------- */
  stringPts(S,anchor,tR){
    const limb=Strings.mapA2L(S,anchor);
    const top=S.anchors[anchor], bot=Puppet.attach(S,limb);
    const lane=S.str.lanes[limb];
    const N=26, pts=new Array(N+1);
    // twist braid parameters for pairs containing this anchor
    const braids=[];
    for(let p=0;p<4;p++){
      let c=S.str.twists[p];
      const un=S.str.unwind;
      let unf=0;
      if(un&&un.pair===p){ unf=1-Math.min(1,(S.now-un.t0)/0.5); }
      if((anchor===p||anchor===p+1)&&(c>0||unf>0)){
        braids.push({side:anchor===p?1:-1, c:Math.max(c,1), amt:c>0?1:unf});
      }
    }
    const slackAmt=lane.slack? Math.min(1,(S.now-lane.slackT)/0.5) :
      Math.max(0,1-(S.now-lane.slackT)/0.4);
    // arrival vibration
    let vib=0;
    for(const p of S.str.pulses){ if(p.anchor===anchor&&p.judged){
      const a=tR-p.t1; if(a>0&&a<0.35) vib=Math.max(vib,(1-a/0.35)); } }
    for(let i=0;i<=N;i++){
      const u=i/N;
      let x=U.lerp(top.x,bot.x,u), y=U.lerp(top.y,bot.y,u);
      for(const b of braids){
        const s=U.clamp((u-0.10)/0.26,0,1);
        if(s>0&&s<1){ const wraps=b.c*2-1;
          x+=b.side*Math.sin(Math.PI*s*wraps)*(9+b.c*5)*b.amt*Math.sin(Math.PI*s); }
      }
      if(slackAmt>0.01){ // catenary sag, heavier toward the limb
        const sag=Math.sin(Math.PI*u)*Math.pow(u,0.6)*slackAmt*S.pup.h*0.17;
        y+=sag; x+=Math.sin(S.now*1.3+anchor)*slackAmt*3*Math.sin(Math.PI*u);
      }
      if(vib>0) x+=Math.sin(u*26+tR*90)*vib*2.2*Math.sin(Math.PI*u);
      pts[i]={x,y};
    }
    // travel pulses: a visible bulge/kink — bake displacement into the line
    for(const p of S.str.pulses){
      if(p.anchor!==anchor||p.judged) continue;
      const u=U.clamp((tR-p.t0)/Math.max(0.001,p.t1-p.t0),0,1);
      for(let i=0;i<=N;i++){
        const du=i/N-u;
        const w=Math.exp(-(du*du)/0.004);
        pts[i].x+=w*5.5; pts[i].y+=w*2.0*Math.sin(tR*40+anchor);
      }
    }
    return {pts,top,bot,limb,lane};
  },
  pointAt(pts,u){
    const f=u*(pts.length-1), i=Math.min(pts.length-2,Math.floor(f)), t=f-i;
    return {x:U.lerp(pts[i].x,pts[i+1].x,t), y:U.lerp(pts[i].y,pts[i+1].y,t)};
  },
  strings(ctx,S,pal,tR){
    const strCol=pal[3]||'#e8ddc4';
    const tau=Strings.travel(S);
    const lead=CFG.leadRing;
    for(let a=0;a<5;a++){
      const {pts,limb,lane}=this.stringPts(S,a,tR);
      // resist tension warning: the string shivers red near the limb
      let resistGlow=0;
      for(const n of S.chart.laneNotes[limb]){
        if(n.type!=='resist') continue;
        if(n.state!=='pending'&&n.state!=='hit') continue;
        const d=n.t-tR;
        if(d<1.0&&d>-n.window) resistGlow=Math.max(resistGlow,1-Math.abs(d)/1.0);
        if(n.t>tR+2) break;
      }
      ctx.lineWidth=1.2;
      ctx.strokeStyle=U.rgba(strCol, lane.slack?0.42:0.66);
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
      if(resistGlow>0){
        ctx.strokeStyle=U.rgba('#c03428',0.5*resistGlow*(0.7+0.3*Math.sin(tR*30)));
        ctx.lineWidth=2.2;
        ctx.beginPath(); const i0=Math.floor(pts.length*0.55); ctx.moveTo(pts[i0].x,pts[i0].y);
        for(let i=i0;i<pts.length;i++) ctx.lineTo(pts[i].x+Math.sin(i*3+tR*60)*resistGlow*1.5,pts[i].y);
        ctx.stroke();
      }
      // hold sustain glow
      if(tR-lane.holdGlow<0.1){
        ctx.strokeStyle=U.rgba(pal[2]||'#d9a441',0.5);
        ctx.lineWidth=2.4;
        ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
        for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
        ctx.stroke();
      }
      // ---- cue beads: hollow rings that DEPART the crossbar at press time
      if(!S.invert) for(const n of S.chart.laneNotes[limb]){
        if(n.t-tR>tau+lead+0.4) break;
        if(n.state!=='pending'&&!(n.state==='hit'&&n.type==='hold')) continue;
        if(n.type==='resist') continue;
        const dep=n.t-tau;
        if(tR<dep){ continue; /* anchor ring handled in crossbar layer */ }
        if(tR<=n.t+0.09){
          const u=U.clamp((tR-dep)/tau,0,1);
          const p=this.pointAt(pts,u);
          ctx.strokeStyle=U.rgba('#fff6dd',0.85);
          ctx.lineWidth=1.6;
          ctx.beginPath(); ctx.arc(p.x,p.y,6.5,0,7); ctx.stroke();
          if(n.type==='hold'){ // sleeve showing the hold span beyond arrival
            ctx.strokeStyle=U.rgba(pal[2]||'#d9a441',0.4);
            ctx.lineWidth=5; ctx.beginPath();
            const pb=this.pointAt(pts,Math.max(0,u-0.13));
            ctx.moveTo(pb.x,pb.y); ctx.lineTo(p.x,p.y); ctx.stroke();
          }
        }
      }
      // resist cue: descending red shiver marker (departs automatically — DON'T press)
      if(!S.invert) for(const n of S.chart.laneNotes[limb]){
        if(n.type!=='resist'||n.state!=='pending') continue;
        const dep=n.t-tau;
        if(tR>=dep&&tR<=n.t+0.02){
          const u=U.clamp((tR-dep)/tau,0,1);
          const p=this.pointAt(pts,u);
          ctx.strokeStyle=U.rgba('#c03428',0.9);
          ctx.lineWidth=1.6;
          ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Math.PI/4+Math.sin(tR*20)*0.2);
          ctx.strokeRect(-4.5,-4.5,9,9); ctx.restore();
        }
        if(n.t>tR+tau+2) break;
      }
      // ---- traveling pulse beads (the player's own input, in flight)
      for(const p of S.str.pulses){
        if(p.anchor!==a) continue;
        const u=(tR-p.t0)/Math.max(0.001,p.t1-p.t0);
        if(u<0||u>1.05) continue;
        const pt=this.pointAt(pts,Math.min(1,u));
        const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,9);
        g.addColorStop(0,U.rgba('#fff3c8',0.95)); g.addColorStop(0.5,U.rgba(pal[2]||'#d9a441',0.5)); g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(pt.x,pt.y,9,0,7); ctx.fill();
        ctx.fillStyle='#fff8e8';
        ctx.beginPath(); ctx.arc(pt.x,pt.y,2.6,0,7); ctx.fill();
      }
      // untangle shimmer: the call, descending the involved strings
      const un=S.str.untangle;
      if(un.active){
        un.slots.forEach((t0,i)=>{
          if(un.seq[i]!==a) return;
          const age=tR-t0;
          if(age>0&&age<0.55){
            const p=this.pointAt(pts,age/0.55*0.8);
            ctx.strokeStyle=U.rgba('#bcd8f0',0.8*(1-age/0.55));
            ctx.lineWidth=1.4;
            ctx.beginPath(); ctx.arc(p.x,p.y,7+age*8,0,7); ctx.stroke();
          }
        });
      }
    }
    // arrival flourishes at limbs
    for(const f of S.judgeFx){
      const age=tR-f.t; if(age>0.5||f.limb<0) continue;
      const col=this.grade2col[f.grade]||'#fff';
      ctx.strokeStyle=U.rgba(col.startsWith('#')?col:'#fff', (1-age/0.5)*0.8);
      ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(f.x,f.y,4+age*46,0,7); ctx.stroke();
    }
  },

  /* ------- crossbar, backstage hands, anchor cues, tilt ghost ------- */
  crossbar(ctx,S,pal,tR){
    if(!S.anchors) return;
    const ang=S.cross.tilt*0.20, cx=L.cx, cy=L.crossY;
    const half=L.barHalf;
    ctx.save();
    // backstage hands: near-silhouette, lit only by weak bounce
    ctx.translate(cx,cy); ctx.rotate(ang);
    for(const s of [-1,1]){
      ctx.fillStyle='#0e0b10';
      ctx.beginPath();
      ctx.ellipse(s*half*0.42,-14,13,20,s*0.35,0,7); ctx.fill();       // fist
      ctx.fillRect(s*half*0.42-8,-L.H*0.2-cy,16,L.H*0.2+cy-8);          // forearm up out of frame
      ctx.fillStyle=U.rgba(pal[2]||'#d9a441',0.05);
      ctx.beginPath(); ctx.ellipse(s*half*0.42,-6,11,6,0,0,Math.PI); ctx.fill(); // faint bounce light
    }
    // the wooden control cross
    const bar=ctx.createLinearGradient(0,-4,0,5);
    bar.addColorStop(0,'#241a12'); bar.addColorStop(0.5,'#3a2b1c'); bar.addColorStop(1,'#170f0a');
    ctx.fillStyle=bar;
    ctx.fillRect(-half,-4,half*2,9);
    ctx.fillRect(-4,-4,8,16); // center spar
    ctx.fillStyle=U.rgba(pal[2]||'#d9a441',0.12);
    ctx.fillRect(-half,4,half*2,1.4); // rim from below
    ctx.restore();
    // anchor hooks + press cues (contracting rings hit the hook at press time)
    const tau=Strings.travel(S), lead=CFG.leadRing;
    for(let a=0;a<5;a++){
      const p=S.anchors[a];
      const lane=S.str.lanes[Strings.mapA2L(S,a)];
      // hook (larger with a faint tap ring on touch devices)
      const hookR=CFG.isTouch?5:3.4;
      ctx.fillStyle=lane.slack?'#4a3428':'#63503a';
      ctx.beginPath(); ctx.arc(p.x,p.y,hookR,0,7); ctx.fill();
      if(CFG.isTouch){
        ctx.strokeStyle=U.rgba('#cfc4ad',0.14); ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(20,L.W*0.035),0,7); ctx.stroke();
      }
      // input glow
      const gAge=tR-lane.glow;
      const kAct=CFG.laneNames[a];
      if(Input.actionDown(kAct)||gAge<0.15){
        ctx.fillStyle=U.rgba('#ffe9b0',0.5*(Input.actionDown(kAct)?1:1-gAge/0.15));
        ctx.beginPath(); ctx.arc(p.x,p.y,hookR+2.6,0,7); ctx.fill();
      }
      // key label (fades during play, returns when idle; pointless on touch)
      const idleT=Math.min(1,Math.max(0,(tR-Input.lastInputSongT)-4)/3);
      if(!CFG.isTouch&&(idleT>0||S.now<4)){
        ctx.fillStyle=U.rgba('#cfc4ad',0.5*Math.max(idleT,S.now<4?1-S.now/4:0));
        ctx.font='10px monospace'; ctx.textAlign='center';
        ctx.fillText(Settings.keyLabel(CFG.laneNames[a]), p.x, p.y-14);
      }
      if(S.mode==='results') continue;
      // departure rings
      if(!S.invert){
        const limb=Strings.mapA2L(S,a);
        for(const n of S.chart.laneNotes[limb]){
          if(n.state!=='pending') continue;
          if(n.type==='resist') continue;
          const dep=n.t-tau, dd=dep-tR;
          if(dd>lead) break;
          if(dd>0){
            const r=6+(dd/lead)*26;
            ctx.strokeStyle=U.rgba(n.type==='hold'?'#e8c98a':'#fff6dd', 0.28+(1-dd/lead)*0.62);
            ctx.lineWidth=dd<0.05?2.6:1.4;
            ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.stroke();
          }
        }
        // untangle response rings (pale blue)
        const un=S.str.untangle;
        if(un.active) un.respSlots.forEach((t0,i)=>{
          if(un.seq[i]!==a||i<un.idx) return;
          const dd=t0-tR;
          if(dd<lead&&dd>-0.22){
            ctx.strokeStyle=U.rgba('#bcd8f0',0.75);
            ctx.lineWidth=i===un.idx?2.2:1.2;
            ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(6,6+(dd/lead)*26),0,7); ctx.stroke();
          }
        });
      } else {
        // inverted finale: pulses descend FROM ABOVE to your hooks — react
        for(const n of S.chart.laneNotes[a]){
          if(n.state!=='pending') continue;
          const dd=n.t-tR;
          if(dd>1.1) break;
          if(dd>-0.12){
            const u=1-Math.max(0,dd)/1.1;
            const topX=U.lerp(L.cx+(a-2)*L.barHalf*0.85, p.x, u);
            const y=U.lerp(-10,p.y,u);
            ctx.strokeStyle=U.rgba('#d8e6f5',0.5);
            ctx.lineWidth=1;
            ctx.beginPath(); ctx.moveTo(U.lerp(L.cx+(a-2)*L.barHalf*0.85,p.x,0),-10);
            ctx.lineTo(p.x,p.y); ctx.stroke();
            const g=ctx.createRadialGradient(topX,y,0,topX,y,10);
            g.addColorStop(0,'rgba(230,240,255,0.95)'); g.addColorStop(1,'rgba(230,240,255,0)');
            ctx.fillStyle=g; ctx.beginPath(); ctx.arc(topX,y,10,0,7); ctx.fill();
          }
        }
      }
    }
    // tilt note ghost bar: match the crossbar to the phantom
    for(const n of S.chart.tiltNotes){
      if(n.state==='hit'||n.state==='missed'||n.state==='skipped') continue;
      const pre=n.t-tR;
      if(pre>1.4) break;
      if(tR<=n.t+n.dur){
        const u=U.clamp((tR-n.t)/n.dur,0,1);
        const target=Strings.curveAt(n.curve,Math.max(0,u));
        const ga=target*0.20;
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(ga);
        ctx.strokeStyle=U.rgba('#bcd8f0', pre>0? 0.25+(1-pre/1.4)*0.3 : 0.62);
        ctx.setLineDash([7,6]); ctx.lineWidth=2;
        ctx.strokeRect(-half,-4,half*2,9);
        ctx.setLineDash([]);
        ctx.restore();
        if(pre<=0){
          const err=Math.abs(S.pup.lean-target);
          ctx.fillStyle=U.rgba(err<=CFG.tiltTol?'#c8d8a8':'#c03428',0.7);
          ctx.font='9px monospace'; ctx.textAlign='center';
          ctx.fillText(err<=CFG.tiltTol?'HELD':'DRIFTING',cx,cy-26);
        }
      }
    }
  },

  reveal(ctx,S,pal,tR,pull){
    // the pull-back: strings run upward from the player's own wrists
    const a=U.smooth(Math.min(1,pull*1.4));
    ctx.save(); ctx.globalAlpha=a;
    ctx.strokeStyle=U.rgba('#d8e6f5',0.35);
    ctx.lineWidth=1.1;
    for(let i=0;i<5;i++){
      const x0=L.cx+(i-2)*L.barHalf*0.42;
      const x1=L.cx+(i-2)*L.barHalf*1.7;
      ctx.beginPath(); ctx.moveTo(x0,L.crossY-16);
      ctx.quadraticCurveTo(U.lerp(x0,x1,0.4),L.crossY*0.4,x1,-30);
      ctx.stroke();
    }
    // something very large, holding the room
    const g=ctx.createRadialGradient(L.cx,-L.H*0.3,10,L.cx,-L.H*0.3,L.H*0.8);
    g.addColorStop(0,'rgba(10,8,14,0.9)'); g.addColorStop(1,'rgba(10,8,14,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,L.W,L.H*0.4);
    ctx.restore();
  },

  proscenium(ctx,S,pal){
    const x0=L.stageX0,x1=L.stageX1;
    ctx.fillStyle='#08060b';
    ctx.fillRect(0,0,x0-18,L.H); ctx.fillRect(x1+18,0,L.W-x1,L.H);
    ctx.fillRect(0,0,L.W,L.stageTop-22); ctx.fillRect(0,L.lipY+L.H*0.045,L.W,L.H);
    // columns + arch band, carved
    const wood='#171017';
    ctx.fillStyle=wood;
    ctx.fillRect(x0-30,L.stageTop-30,30,L.lipY-L.stageTop+80);
    ctx.fillRect(x1,L.stageTop-30,30,L.lipY-L.stageTop+80);
    ctx.fillRect(x0-30,L.stageTop-34,(x1-x0)+60,26);
    ctx.strokeStyle=U.rgba(pal[2]||'#d9a441',0.14);
    ctx.lineWidth=1;
    ctx.strokeRect(x0-24,L.stageTop-30,(x1-x0)+48,18);
    ctx.strokeRect(x0-26,L.stageTop-16,4,L.lipY-L.stageTop+40);
    ctx.strokeRect(x1+22,L.stageTop-16,4,L.lipY-L.stageTop+40);
    // curtain swags top corners
    ctx.fillStyle='#1c0e12';
    for(const s of [0,1]){
      const bx=s? x1 : x0;
      ctx.beginPath();
      ctx.moveTo(bx,L.stageTop-12);
      ctx.quadraticCurveTo(bx+(s?-70:70),L.stageTop+40,bx,L.stageTop+90);
      ctx.lineTo(bx,L.stageTop-12); ctx.closePath(); ctx.fill();
    }
  },

  surtitles(ctx,S,tR){
    for(const ln of S.linesActive){
      const age=tR-ln.t0, dur=ln.dur;
      if(age<0||age>dur) continue;
      const a=Math.min(1,age/0.8)*Math.min(1,(dur-age)/0.8);
      const flick=Settings.d.reduceFlash?1:(0.92+0.08*Math.sin(tR*47+ln.t0));
      ctx.font=`${Math.max(12,L.H*0.019)}px Georgia, serif`;
      ctx.textAlign='center';
      ctx.fillStyle=U.rgba('#cdbfa4',0.85*a*flick);
      const sp=ln.text.toUpperCase().split('').join('  ');
      ctx.fillText(sp, L.cx, L.stageTop+24);
    }
  },

  hud(ctx,S,tR){
    const sc=S.score;
    ctx.textAlign='center';
    // judgment popups
    for(const f of S.judgeFx){
      const age=tR-f.t; if(age<0||age>0.9) continue;
      const a=age<0.1?age/0.1:Math.max(0,1-(age-0.4)/0.5);
      ctx.font=`${f.grade==='perfect'?13:12}px Georgia,serif`;
      ctx.fillStyle=U.rgba(this.grade2col[f.grade]||'#fff',a);
      const txt=this.grade2txt[f.grade]||'';
      ctx.fillText(txt, f.x, f.y-24-age*26);
      if((f.grade==='early'||f.grade==='late')&&f.delta){
        ctx.font='9px monospace';
        ctx.fillText(U.fmtMs(f.delta), f.x, f.y-12-age*26);
      }
    }
    // combo, right column
    if(sc&&sc.combo>2){
      ctx.font=`${Math.min(30,15+sc.combo*0.2)}px Georgia,serif`;
      ctx.fillStyle=U.rgba('#e0a94f',0.75);
      ctx.fillText(String(sc.combo), L.stageX1+ (L.W-L.stageX1)/2+9, L.H*0.42);
      ctx.font='9px monospace'; ctx.fillStyle=U.rgba('#7a7160',0.8);
      ctx.fillText('COMBO', L.stageX1+(L.W-L.stageX1)/2+9, L.H*0.42+14);
    }
    // travel latency readout — the number you are playing ahead by
    const narrow=L.W<700;
    if(Settings.d.showLatency&&!S.invert&&(Game.mode==='play'||Game.mode==='editor-play')){
      ctx.font='10px monospace'; ctx.textAlign='left';
      ctx.fillStyle=U.rgba('#7a7160',0.85);
      const lx=8, ly=narrow?14:L.crossY+4;
      ctx.fillText(`lead ${Math.round(Strings.travel(S)*1000)}ms`, lx, ly);
      ctx.fillText(`string ${Math.round(S.strLen)}`, lx, ly+13);
    }
    // twist indicator
    const tw=Strings.totalTwists(S);
    if(tw>0){
      ctx.textAlign='left';
      ctx.font='11px Georgia,serif';
      const ty=narrow?L.crossY+56:L.crossY+34;
      ctx.fillStyle=U.rgba('#c03428',0.75+0.25*Math.sin(tR*6));
      ctx.fillText('✕'.repeat(tw)+' tangled', 12, ty);
      const un=S.str.untangle;
      if(un.active){
        ctx.fillStyle=U.rgba('#bcd8f0',0.9);
        ctx.fillText(un.phase==='call'?'watch…':'echo it back', 12, ty+14);
      }
    }
    // progress thread across the very top
    if(S.chart&&S.chart.endT>0){
      ctx.fillStyle=U.rgba('#e0a94f',0.28);
      ctx.fillRect(0,0,L.W*U.clamp(tR/S.chart.endT,0,1),2);
    }
    // visual metronome
    if(Settings.d.visMetronome&&S.chart){
      const beat=Chart.beatOfTime(S.chart,tR);
      const ph=U.fract(beat);
      const strong=Math.floor(beat)%S.chart.timing.beatsPerBar===0;
      ctx.fillStyle=U.rgba(strong?'#e0a94f':'#7a7160',Math.max(0,1-ph*2.2)*0.8);
      ctx.beginPath();
      const mx=L.stageX0-44,my=L.crossY+8;
      ctx.moveTo(mx,my-7); ctx.lineTo(mx+7,my); ctx.lineTo(mx,my+7); ctx.lineTo(mx-7,my);
      ctx.closePath(); ctx.fill();
    }
  },

  fx(ctx,S,tR){
    // scare flash / blackout — reduce-flash swaps hard cuts for slow fades
    if(S.fx.flash>0.01&&!Settings.d.reduceFlash){
      ctx.fillStyle=U.rgba('#e8ddc4',S.fx.flash*0.5);
      ctx.fillRect(0,0,L.W,L.H);
    }
    if(S.fx.black>0.01){
      ctx.fillStyle=U.rgba('#000000',Math.min(1,S.fx.black));
      ctx.fillRect(0,0,L.W,L.H);
    }
  },
  filmGrain(ctx,S,tR){
    Stage.screenCaches();
    ctx.globalAlpha=0.038;
    const ox=Settings.d.reduceFlash?0:((tR*17)%192), oy=Settings.d.reduceFlash?0:((tR*29)%192);
    ctx.drawImage(Stage.grainScreen,-ox,-oy);
    ctx.globalAlpha=1;
    ctx.drawImage(Stage.vignette,0,0);
  },
};

/* ═══ Layout — screen geometry, recomputed on resize ═══ */
const L = {
  W:800,H:600,cx:400,crossY:60,stageX0:80,stageX1:720,stageTop:90,lipY:470,audTop:500,barHalf:120,
  recompute(){
    this.W=innerWidth; this.H=innerHeight; this.cx=this.W/2;
    const narrow=this.W<700;
    this.crossY=this.H*(narrow?0.072:0.088);
    this.stageX0=this.W*(narrow?0.045:0.115); this.stageX1=this.W*(narrow?0.955:0.885);
    this.stageTop=this.H*0.155; this.lipY=this.H*0.775;
    this.audTop=this.H*0.828;
    // on phones the bar spans most of the width so hooks sit a thumb apart
    this.barHalf=narrow? this.W*0.40 : Math.min(this.W*0.17,300);
  },
  floorAt(d){ return U.lerp(this.H*0.740, this.H*0.560, d); },
};

/* ═══ MODULE: Game — GameState + fixed-timestep update (120 Hz) ═══
   `S` is the single state object; update mutates it at a fixed 120 Hz
   decoupled from render; Renderer only reads it. */
const Game = {
  mode:'boot', S:null, actId:null, isCampaign:false, pendingChart:null,
  raw:null, _acc:0, _last:0, paused:false,

  newState(chart){
    const d0=chart.stage.puppetDepth??0.35;
    const S={
      chart, d0, depth:d0, depthAnim:null,
      strLen:chart.strings.length,
      now:-2, playing:true, invert:false,
      baseUnease:0.08, unease:0.08,
      cross:{tilt:0}, anchors:[],
      linesActive:[], evPtr:0, cuePtr:0,
      fx:{flash:0,black:0,scareT:-9,lookUpT:-9,pullback:0,pullAnim:null,bow:false,twistPop:-9},
      transitionActive:false, idleNow:false,
      mode:'play',
    };
    this.computeAnchors(S);
    return S;
  },
  computeAnchors(S){
    const ang=S.cross.tilt*0.20;
    const c=Math.cos(ang), s=Math.sin(ang);
    S.anchors=[-1,-0.5,0,0.5,1].map(f=>({
      x:L.cx+f*L.barHalf*c, y:L.crossY+f*L.barHalf*s+5 }));
  },

  async startChart(raw, opts={}){
    try{
      const errs=Chart.validate(raw);
      if(errs.length){ toast('chart error: '+errs[0]); return false; }
      this.raw=raw;
      const chart=Chart.normalize(raw);
      toast('preparing…',9000);
      const buf=await Chart.resolveAudio(raw, m=>toast(m,9000));
      Clock.setBuffer(buf);
      const S=this.newState(chart);
      this.S=S;
      this.actId=opts.actId||null; this.isCampaign=!!opts.actId;
      S.baseUnease = this.isCampaign? (Story.d.baseUnease||0.08) : 0.08;
      Strings.reset(S); Puppet.reset(S);
      Stage.prepare(S); Audience.reset(S,S.baseUnease);
      Scoring.reset(S, chart.judgeCount);
      Input.lastInputSongT=-99;
      const from=opts.from||0;
      if(from>0) this.fastForward(S,from);
      const preroll=opts.editorMode?1.2:2.2;
      this.mode=opts.editorMode?'editor-play':'play';
      this.paused=false;
      UI.hideAll();
      document.getElementById('edit').classList.toggle('show', !!opts.editorMode);
      Clock.play(from-preroll+ (from>0?preroll-1.2:0), 0.15);
      // (above: cold start pre-rolls 2.2s; editor playtest 1.2s)
      toast(opts.editorMode?'playtest — Esc to stop':chart.meta.title,1800);
      return true;
    }catch(err){ console.error(err); toast('failed: '+err.message,4000); UI.showTitle(); return false; }
  },
  fastForward(S,from){
    for(const n of S.chart.notes){
      if(n.t<from-0.05){ n.state='skipped';
        if(n.type!=='tilt') S.score.total--; else S.score.total--; }
    }
    for(let i=0;i<S.chart.events.length;i++){
      const e=S.chart.events[i];
      if(e.t>=from) break;
      S.evPtr=i+1;
      this.fireEvent(S,e,true);
    }
    if(S.depthAnim){ S.depth=S.depthAnim.to; S.depthAnim=null; }
    if(S.fx.pullAnim){ S.fx.pullback=S.fx.pullAnim.to; S.fx.pullAnim=null; }
  },

  update(dt){
    const S=this.S;
    if(this.mode==='play'||this.mode==='editor-play'){
      if(this.paused||!S) return;
      S.now=Clock.t();
      Input.update(dt);
      const tgt=Input.tilt();
      S.cross.tilt+=(tgt-S.cross.tilt)*Math.min(1,dt*13);
      this.computeAnchors(S);
      // depth / string length
      if(S.depthAnim){ const a=S.depthAnim, u=U.clamp((S.now-a.t0)/a.dur,0,1);
        S.depth=U.lerp(a.from,a.to,U.smooth(u)); if(u>=1) S.depthAnim=null; }
      S.strLen=S.chart.strings.length*CFG.depthScale(S.depth)/CFG.depthScale(S.d0);
      if(S.fx.pullAnim){ const a=S.fx.pullAnim,u=U.clamp((S.now-a.t0)/a.dur,0,1);
        S.fx.pullback=U.lerp(a.from,a.to,U.smooth(u)); if(u>=1) S.fx.pullAnim=null; }
      // chart events
      const evs=S.chart.events;
      while(S.evPtr<evs.length && evs[S.evPtr].t<=S.now){ this.fireEvent(S,evs[S.evPtr],false); S.evPtr++; }
      while(S.cuePtr<S.chart.notes.length && S.chart.notes[S.cuePtr].t<S.now-1.5) S.cuePtr++;
      Strings.update(S,dt);
      Puppet.update(S,dt);
      Stage.update(S,dt);
      Audience.update(S,dt);
      Scoring.tick(S,{slackCount:S.str.lanes.filter(l=>l.slack).length,
        idle:S.idleNow, twists:Strings.totalTwists(S), unease:S.unease});
      S.linesActive=S.linesActive.filter(l=>S.now-l.t0<l.dur+1);
      S.fx.flash*=Math.max(0,1-dt*3.2);
      if(S.fx.blackAnim){ const b=S.fx.blackAnim,u=U.clamp((S.now-b.t0)/b.dur,0,1);
        S.fx.black=U.lerp(b.from,b.to,u); if(u>=1) S.fx.blackAnim=null; }
      if(S.now>S.chart.endT||Clock.ended()) this.endSong();
    } else if(this.mode==='menu'||this.mode==='title'||this.mode==='results'){
      if(S&&S.demo){
        S.now+=dt;
        S.cross.tilt=Math.sin(S.now*0.42)*0.25;
        this.computeAnchors(S);
        S.strLen=S.chart.strings.length;
        Puppet.update(S,dt); Stage.update(S,dt); Audience.update(S,dt);
        Strings.update(S,dt);
      }
    } else if(this.mode==='calib'){ Calib.update(dt); }
  },

  fireEvent(S,e,instant){
    switch(e.type){
      case 'flatSwap': Stage.flatSwap(S,e.flat,e.to);
        if(instant){ for(const f of S.stageR.flats){ if(f.state==='leaving'){f.state='out';f.slide=1;} if(f.state==='entering'){f.state='in';f.slide=0;} } }
        break;
      case 'depth':
        if(instant){ S.depth=e.to; }
        else S.depthAnim={from:S.depth,to:U.clamp(e.to,0,1),t0:S.now,dur:Math.max(0.3,e.duration||2)};
        break;
      case 'audience': Audience.event(S,e); if(instant) Audience.applyAll(S); break;
      case 'line': if(!instant) S.linesActive.push({text:e.text||'',t0:S.now,dur:e.duration||4.5}); break;
      case 'scare': if(!instant) this.doScare(S,e.id||'lookUp'); break;
      case 'footlights':
        if(typeof e.flicker==='number') S.stageR.flicker=U.clamp(e.flicker,0,1);
        if(Array.isArray(e.set)) e.set.forEach((v,i)=>{ if(S.stageR.lights[i]) S.stageR.lights[i].base=v; });
        break;
      case 'invert': S.invert=e.on!==false;
        S.str.twists=[0,0,0,0];
        break;
      case 'bow': S.fx.bow=e.on!==false; break;
      case 'pullback':
        if(instant) S.fx.pullback=e.to??1;
        else S.fx.pullAnim={from:S.fx.pullback,to:e.to??1,t0:S.now,dur:e.duration||3};
        break;
      case 'blackout':
        if(!instant) S.fx.blackAnim={from:S.fx.black,to:e.to??1,t0:S.now,dur:e.duration||1};
        break;
    }
  },
  /* a hard scare: charts may fire at most two per campaign; the sting sound
     is permitted ONLY here. "disable jumpscares" swaps in a neutral cue. */
  doScare(S,id){
    S.fx.scareT=S.now;
    SFX.sting(id);
    S.stageR.dimPulse=S.now;
    if(id==='lookUp'){
      S.fx.lookUpT=S.now;
      if(!Settings.d.reduceFlash&&!Settings.d.noScare) S.fx.flash=0.55;
    } else if(id==='reveal'){
      S.fx.lookUpT=S.now;
      S.fx.pullAnim={from:S.fx.pullback,to:1,t0:S.now,dur:Settings.d.noScare?5:2.6};
      Audience.applyOne(S,'face');
      if(!Settings.d.reduceFlash&&!Settings.d.noScare) S.fx.flash=0.4;
    } else if(id==='blackout'){
      S.fx.blackAnim={from:1,to:0,t0:S.now,dur:1.4};
    }
    S.unease=Math.min(1,S.unease+0.1);
  },

  endSong(){
    if(this.mode!=='play'&&this.mode!=='editor-play') return;
    if(this.mode==='editor-play'){ Editor.stopPlaytest(); return; }
    const S=this.S;
    Clock.stop();
    const res=Scoring.finalize(S);
    this.lastRes=res;
    this.mode='results';
    if(this.isCampaign&&this.actId) Story.record(this.actId,res);
    UI.showResults(res,this.actId);
  },
  quitToMenu(){
    Clock.stop(); this.paused=false;
    document.getElementById('edit').classList.remove('show');
    this.demo(); UI.showTitle();
  },

  onTrigger(anchor,stamp,src){
    if(this.mode==='calib'){ Calib.tap(stamp); return; }
    if((this.mode==='play'||this.mode==='editor-play')&&!this.paused&&this.S){
      if(anchor<0) return;
      const t=Clock.stampToT(stamp);
      Strings.trigger(this.S,anchor,t);
    }
  },
  onRelease(anchor,stamp){
    if((this.mode==='play'||this.mode==='editor-play')&&this.S)
      Strings.release(this.S,anchor,Clock.stampToT(stamp));
  },
  onStageTap(e){},

      else if(this.mode==='calib'){ Calib.cancel(); }
      else if(this.mode==='results'){ this.quitToMenu(); }
    }

  /* attract-mode state behind the menus: the theater, waiting */
  demo(){

    S.demo=true; S.playing=false; S.now=0;

    Strings.reset(S); Puppet.reset(S); Stage.prepare(S);
    Audience.reset(S,Story.d.baseUnease*0.7);
    Scoring.reset(S,1);
    this.S=S; this.mode='title';
  },

  renderTime(){
    if(this.mode==='play'||this.mode==='editor-play') return this.paused? this.S.now : Clock.t();
    return this.S? this.S.now : 0;
  },
  loop(){
    this._last=performance.now();
    const frame=(nowMs)=>{
      requestAnimationFrame(frame);
      const dt=Math.min(0.25,(nowMs-this._last)/1000); this._last=nowMs;
      Clock.updatePerfOff();
      this._acc=Math.min(0.25,this._acc+dt);
      while(this._acc>=CFG.updateDt){ this.update(CFG.updateDt); this._acc-=CFG.updateDt; }
      if(this.mode==='calib'){ Calib.render(Renderer.ctx); }
      else if(this.S) Renderer.render(this.S,this.renderTime());
      if(Editor.open) Editor.frame();
    };
    requestAnimationFrame(frame);
  },
};

/* ═══ Calibration — audio offset and input offset, measured separately ═══
   Phase 1 taps against sound only; phase 2 taps against a silent visual
   pulse. inputOffset := visual mean; audioOffset := audio mean − visual
   mean. Runs on first launch, redo any time from settings. */
const Calib = {
  phase:null, ticks:[], taps:[], start:0, n:0, results:{},
  begin(){
    Clock.ensure();
    Game.mode='calib'; UI.hideAll();
    this.phaseStart('audio');
  },
  phaseStart(ph){
    this.phase=ph; this.taps=[]; this.ticks=[];
    if(ph==='audio'){
      const t0=Clock.ctx.currentTime+1.2;
      for(let i=0;i<14;i++){ const tt=t0+i*0.6; this.ticks.push(tt); SFX.calTick(tt, i%4===0); }
    } else {
      this.start=performance.now()+1000;
      this.ticks=[]; for(let i=0;i<14;i++) this.ticks.push(this.start+i*600);
    }
  },
  tap(stamp){
    if(this.phase==='audio'){
      const t=Clock.stampToCtx(stamp);
      let best=null,bd=0.31;
      for(const tt of this.ticks){ const d=t-tt; if(Math.abs(d)<Math.abs(bd)||best===null){ if(Math.abs(d)<0.31){best=tt;bd=d;} } }
      if(best!=null&&this.ticks.indexOf(best)>=2) this.taps.push(bd);
    } else if(this.phase==='visual'){
      let best=null,bd=310;
      for(const tt of this.ticks){ const d=stamp-tt; if(Math.abs(d)<Math.abs(bd)||best===null){ if(Math.abs(d)<310){best=tt;bd=d;} } }
      if(best!=null&&this.ticks.indexOf(best)>=2) this.taps.push(bd/1000);
    }
    if(this.taps.length>=8) this.phaseDone();
  },
  mean(arr){ const a=arr.slice().sort((x,y)=>x-y).slice(1,-1); return a.reduce((s,v)=>s+v,0)/Math.max(1,a.length); },
  phaseDone(){
    if(this.phase==='audio'){ this.results.audio=this.mean(this.taps); this.phaseStart('visual'); }
    else {
      this.results.visual=this.mean(this.taps);
      const vis=U.clamp(this.results.visual,-0.25,0.35);
      const aud=U.clamp(this.results.audio-vis,-0.25,0.35);
      Settings.d.inputOffset=Math.round(vis*1000)/1000;
      Settings.d.audioOffset=Math.round(aud*1000)/1000;
      Settings.d.calibrated=true; Settings.save();
      this.phase=null; Game.demo(); UI.showCalibDone(aud,vis);
    }
  },
  update(dt){
    if(this.phase==='audio'&&Clock.ctx&&Clock.ctx.currentTime>this.ticks[13]+0.7) this.phaseDone();
    if(this.phase==='visual'&&performance.now()>this.ticks[13]+700) this.phaseDone();
  },
  cancel(){ this.phase=null; Game.demo(); UI.showTitle(); },
  render(ctx){
    ctx.fillStyle='#050508'; ctx.fillRect(0,0,L.W,L.H);
    ctx.textAlign='center';
    ctx.fillStyle='#cfc4ad'; ctx.font=`${Math.max(15,L.H*0.024)}px Georgia,serif`;
    if(this.phase==='audio'){
      ctx.fillText('C A L I B R A T I O N — 1 of 2', L.cx, L.H*0.3);
      ctx.font='14px Georgia,serif'; ctx.fillStyle='#7a7160';
      ctx.fillText('tap any string key (or the screen) exactly ON each tick you HEAR', L.cx, L.H*0.38);
      ctx.fillText(`${this.taps.length} / 8`, L.cx, L.H*0.6);
      const ct=Clock.ctx?Clock.ctx.currentTime:0;
      for(const tt of this.ticks){ const a=1-Math.min(1,Math.abs(ct-tt)*4);
        if(a>0){ ctx.fillStyle=U.rgba('#e0a94f',a*0.6); ctx.beginPath(); ctx.arc(L.cx,L.H*0.5,18,0,7); ctx.fill(); } }
    } else if(this.phase==='visual'){
      ctx.fillText('C A L I B R A T I O N — 2 of 2', L.cx, L.H*0.3);
      ctx.font='14px Georgia,serif'; ctx.fillStyle='#7a7160';
      ctx.fillText('no sound now — tap exactly when the ring CLOSES on the dot', L.cx, L.H*0.38);
      ctx.fillText(`${this.taps.length} / 8`, L.cx, L.H*0.62);
      const now=performance.now();
      let next=this.ticks.find(t=>t>now-100);
      if(next!=null){
        const u=U.clamp(1-(next-now)/600,0,1);
        ctx.strokeStyle='#cfc4ad'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(L.cx,L.H*0.5,8+(1-u)*60,0,7); ctx.stroke();
        const closed=Math.abs(next-now)<50;
        ctx.fillStyle=closed?'#e0a94f':'#8a8172';
        ctx.beginPath(); ctx.arc(L.cx,L.H*0.5,closed?10:6,0,7); ctx.fill();
      }
    }
    ctx.font='11px Georgia,serif'; ctx.fillStyle='#55503f';
    ctx.fillText('Esc to cancel', L.cx, L.H*0.9);
  },
};

      this.btn('menu',()=>Game.quitToMenu(),'small'));
  },
  showPause(){
    this.show(
      U.el('h2',null,'intermission'),
      this.btn('resume',()=>Game.togglePause()),
      this.btn('restart',()=>{ Game.paused=false; if(Game.actId) Game.startChart(Charts.get(Game.actId).build(),{actId:Game.actId}); else Game.startChart(Game.raw); },'small'),
      this.btn('give up the cross',()=>Game.quitToMenu(),'small'));
  },
  showCalibDone(aud,vis){
    this.show(
      U.el('h2',null,'tuned'),
      U.el('table',{class:'stats'},
        U.el('tr',null,U.el('td',null,'audio offset'),U.el('td',null,U.fmtMs(aud))),
        U.el('tr',null,U.el('td',null,'input offset'),U.el('td',null,U.fmtMs(vis)))),
      U.el('div',{class:'small',style:'text-align:center'},'stored locally. redo any time in settings.'),
      this.btn('begin',()=>this.showTitle()));
  },
};

/* ═══ MODULE: Editor — charts are first-class (?edit=1) ═══
   Operates directly on the RAW chart object; every edit re-normalizes for
   preview. Export serializes raw (minus runtime __fields) → lossless
   round-trip. Waveform scrub, snap 1/1–1/16, five string lanes + tilt +
   events, live playtest from the cursor. */
const Editor = {
  open:false, raw:null, norm:null, buffer:null, peaks:null,
  cursor:0, zoom:110, scrollT:0, snap:4, tool:'pull', sel:null,
  drag:null, dirty:false, stageMode:false, lastSeek:0,
  laneRows:['handL','legL','head','legR','handR'],

  async enter(raw){
    Clock.ensure();
    this.open=true; this.raw=raw||this.raw||this.newChart();
    Game.mode='editor'; UI.hideAll();
    document.getElementById('edit').classList.add('show');
    this.buildBar(); this.buildInsp();
    await this.loadAudio();
    this.refresh(); this.seekPreview(this.cursor,true);
    toast('editor — Space playtests from the cursor; changes are NOT autosaved: export!',4200);
    addEventListener('beforeunload',this._unload=(e)=>{ if(this.dirty){ e.preventDefault(); e.returnValue=''; } });
  },
  exit(){
    this.open=false;
    document.getElementById('edit').classList.remove('show');
    Clock.stop(); Game.quitToMenu();
  },
  newChart(){
    const c=Chart.blank();
    c.meta.title='new chart'; c.meta.mapper='you';
    c.synth=this.tickTrack(120,90);
    return c;
  },
  tickTrack(bpm,secs){
    const spb=60/bpm, n=Math.floor(secs/spb), notes=[],bass=[];
    for(let i=0;i<n;i++){ notes.push([i*spb, i%4===0?84:72, 0.05, i%4===0?1:0.6]);
      if(i%2===0) bass.push([i*spb,36,0.4,0.5]); }
    return {id:'ticktrack'+bpm+'x'+secs, len:secs, tail:1, space:0.15,
      tracks:[{inst:'tick',notes},{inst:'bass',notes:bass,vol:0.6}]};
  },
  async loadAudio(){
    try{ this.buffer=await Chart.resolveAudio(this.raw, m=>toast(m,4000));
      Clock.setBuffer(this.buffer);
      this.makePeaks(); }
    catch(e){ toast('audio: '+e.message); this.buffer=null; this.peaks=null; }
  },
  makePeaks(){
    const b=this.buffer; if(!b){this.peaks=null;return;}
    const ch=b.getChannelData(0), bin=Math.floor(b.sampleRate*0.01), n=Math.ceil(ch.length/bin);
    const pk=new Float32Array(n);
    for(let i=0;i<n;i++){ let m=0; const e=Math.min(ch.length,(i+1)*bin);
      for(let j=i*bin;j<e;j+=4){ const v=Math.abs(ch[j]); if(v>m)m=v; } pk[i]=m; }
    this.peaks=pk;
  },
  refresh(){
    try{ this.norm=Chart.normalize(this.raw); }catch(e){ toast('chart error: '+e.message); }
  },
  markDirty(){ this.dirty=true; this.refresh(); this.seekPreview(this.cursor,true); },

  /* ---------- preview state on the main canvas ---------- */
  seekPreview(t,force){
    if(Game.mode!=='editor') return;
    const nowMs=performance.now();
    if(!force&&nowMs-this.lastSeek<40) return;
    this.lastSeek=nowMs;
    this.cursor=Math.max(0,t);
    let norm; try{ norm=Chart.normalize(this.raw); }catch(e){ return; }
    const S=Game.newState(norm);
    S.demo=false; Game.S=S;
    Strings.reset(S); Puppet.reset(S); Stage.prepare(S);
    Audience.reset(S,0.1); Scoring.reset(S,this.norm.judgeCount);
    Game.fastForward(S,this.cursor);
    S.now=this.cursor;
    Game.computeAnchors(S);
    for(let i=0;i<40;i++){ Puppet.update(S,CFG.updateDt); Stage.update(S,CFG.updateDt); }
  },
  playtest(){
    if(Game.mode==='editor-play'){ this.stopPlaytest(); return; }
    Game.startChart(this.raw,{from:this.cursor, editorMode:true});
  },
  stopPlaytest(){
    Clock.stop(); Game.mode='editor'; Game.paused=false;
    document.getElementById('edit').classList.add('show');
    Clock.setBuffer(this.buffer);
    this.refresh(); this.seekPreview(this.cursor,true);
  },

  /* ---------- toolbar ---------- */
  buildBar(){
    const bar=document.getElementById('ebar'); bar.innerHTML='';
    const b=(label,fn,id)=>{ const e=U.el('button',{class:'ebtn',id:id||''},label);
      e.addEventListener('click',fn); bar.append(e); return e; };
    b('▶ test',()=>this.playtest());
    bar.append(U.el('span',{class:'sep'}));
    for(const t of ['select','pull','hold','resist','chord','tilt','event','erase']){
      const e=b(t,()=>{ this.tool=t; this.buildBar(); });
      if(this.tool===t) e.classList.add('on');
    }
    bar.append(U.el('span',{class:'sep'}),U.el('span',{class:'lbl'},'snap 1/'));
    const snapSel=U.el('select',null,...[1,2,3,4,6,8,12,16].map(d=>{
      const o=U.el('option',{value:d},String(d)); if(d===this.snap) o.selected=true; return o; }));
    snapSel.addEventListener('change',()=>this.snap=parseInt(snapSel.value,10));
    bar.append(snapSel);
    b('−',()=>{this.zoom=Math.max(30,this.zoom/1.4);});
    b('+',()=>{this.zoom=Math.min(600,this.zoom*1.4);});
    bar.append(U.el('span',{class:'sep'}));
    const meta=this.raw.meta, timing=this.raw.timing;
    const field=(lbl,val,w,fn)=>{ bar.append(U.el('span',{class:'lbl'},lbl));
      const i=U.el('input',{type:'text',value:val,style:`width:${w}px`});
      i.addEventListener('change',()=>{fn(i.value); this.markDirty();}); bar.append(i); };
    field('title',meta.title,90,v=>meta.title=v);
    field('bpm',timing.bpms[0].bpm,42,v=>timing.bpms[0].bpm=parseFloat(v)||120);
    field('offset',timing.offset,42,v=>timing.offset=parseFloat(v)||0);
    field('len',this.raw.strings.length,44,v=>this.raw.strings.length=parseFloat(v)||420);
    field('speed',this.raw.strings.pulseSpeed,44,v=>this.raw.strings.pulseSpeed=parseFloat(v)||900);
    bar.append(U.el('span',{class:'sep'}));
    b('audio…',()=>UI.pickFile(async(buf,f)=>{ try{
        this.raw.__audioBuffer=await Clock.ctx.decodeAudioData(buf);
        this.raw.meta.audio=f.name; this.raw.synth=null;
        await this.loadAudio(); this.markDirty(); toast('audio: '+f.name);
      }catch(e){toast('decode failed');} },'audio/*,.mp3,.ogg,.wav'));
    b('tick-track',async()=>{ this.raw.synth=this.tickTrack(parseFloat(this.raw.timing.bpms[0].bpm)||120,120);
      delete this.raw.__audioBuffer; await this.loadAudio(); this.markDirty(); });
    b('stage…',()=>{ this.stageMode=!this.stageMode; this.buildInsp(); });
    bar.append(U.el('span',{class:'sep'}));
    b('export',()=>{ U.dl((this.raw.meta.title||'chart').replace(/\W+/g,'_')+'.chart.json', this.exportJSON()); this.dirty=false; });
    b('copy',async()=>{ try{ await navigator.clipboard.writeText(this.exportJSON()); toast('copied'); }catch(e){ toast('clipboard blocked'); } });
    b('import…',()=>UI.pickFile(async t=>{ try{ this.raw=Chart.fromText(t); await this.loadAudio(); this.refresh(); this.buildBar(); this.markDirty(); this.dirty=false; }catch(e){ toast(e.message); } }));
    b('new',()=>{ if(confirm('discard current chart?')){ this.raw=this.newChart(); this.loadAudio().then(()=>{this.refresh();this.buildBar();this.seekPreview(0,true);}); } });
    b('close',()=>{ if(!this.dirty||confirm('unsaved changes — close anyway?')) this.exit(); });
  },
  exportJSON(){ return JSON.stringify(this.raw,(k,v)=>k.startsWith&&k.startsWith('__')?undefined:v,1); },

  /* ---------- inspector ---------- */
  buildInsp(){
    const el=document.getElementById('einsp'); el.innerHTML='';
    if(this.stageMode){ this.buildStageInsp(el); return; }
    const s=this.sel;
    if(!s){ el.append(U.el('span',{class:'lbl'},'select a note/event to edit · click lanes to place · right-drag or erase-tool to delete · drag hold/tilt right edge for duration')); return; }
    const fld=(lbl,val,w,fn)=>{ el.append(U.el('span',{class:'lbl'},lbl));
      const i=U.el('input',{type:'text',value:val,style:`width:${w}px`});
      i.addEventListener('change',()=>{ fn(i.value); this.markDirty(); this.buildInsp(); }); el.append(i); };
    if(s.kind==='note'){
      const n=s.ref;
      el.append(U.el('span',{class:'lbl'},'note: '+(n.type||'pull')));
      fld('t',n.t.toFixed(3),64,v=>n.t=parseFloat(v)||0);
      if(n.type==='chord') fld('strings',(n.strings||[]).join(','),140,v=>n.strings=v.split(',').map(x=>x.trim()).filter(x=>CFG.laneOf[x]!=null));
      else if(n.type!=='tilt') fld('string',n.string,60,v=>{ if(CFG.laneOf[v]!=null) n.string=v; });
      if(n.type==='hold'||n.type==='tilt') fld('duration',n.duration??1,48,v=>n.duration=Math.max(0.1,parseFloat(v)||1));
      if(n.type==='resist') fld('window',n.window??0.25,44,v=>n.window=Math.max(0.05,parseFloat(v)||0.25));
      if(n.type==='tilt') fld('curve',JSON.stringify(n.curve||[[0,0],[1,0]]),220,v=>{ try{n.curve=JSON.parse(v);}catch(e){toast('bad curve json');} });
      fld('cross',n.cross??'',36,v=>{ const p=parseInt(v,10); if(isNaN(p)) delete n.cross; else n.cross=p; });
      const del=U.el('button',{class:'ebtn'},'delete'); del.addEventListener('click',()=>this.deleteSel()); el.append(del);
    } else {
      const ev=s.ref;
      el.append(U.el('span',{class:'lbl'},'event'));
      fld('t',ev.t.toFixed(3),64,v=>ev.t=parseFloat(v)||0);
      const types=['line','flatSwap','depth','audience','scare','footlights','invert','pullback','bow','blackout'];
      const sel=U.el('select',null,...types.map(t=>{ const o=U.el('option',{value:t},t); if(ev.type===t)o.selected=true; return o; }));
      sel.addEventListener('change',()=>{ ev.type=sel.value; this.markDirty(); this.buildInsp(); });
      el.append(sel);
      const extra={...ev}; delete extra.t; delete extra.type;
      const j=U.el('input',{type:'text',value:JSON.stringify(extra),style:'width:340px'});
      j.addEventListener('change',()=>{ try{ const o=JSON.parse(j.value||'{}');
          for(const k of Object.keys(ev)) if(k!=='t'&&k!=='type') delete ev[k];
          Object.assign(ev,o); this.markDirty(); }catch(e){ toast('bad params json'); } });
      el.append(U.el('span',{class:'lbl'},'params'),j);
      const del=U.el('button',{class:'ebtn'},'delete'); del.addEventListener('click',()=>this.deleteSel()); el.append(del);
    }
  },
  buildStageInsp(el){
    el.append(U.el('span',{class:'lbl'},'palette'));
    const st=this.raw.stage;
    st.palette.forEach((c,i)=>{
      const inp=U.el('input',{type:'color',value:/^#[0-9a-f]{6}$/i.test(c)?c:'#888888',title:'palette['+i+']'});
      inp.addEventListener('input',()=>{ st.palette[i]=inp.value; this.markDirty(); });
      el.append(inp);
    });
    const addC=U.el('button',{class:'ebtn'},'+'); addC.addEventListener('click',()=>{ if(st.palette.length<12){ st.palette.push('#888888'); this.markDirty(); this.buildInsp(); } else toast('palette capped at 12 per act'); });
    el.append(addC);
    el.append(U.el('span',{class:'lbl'},'depth'));
    const d=U.el('input',{type:'text',value:st.puppetDepth,style:'width:40px'});
    d.addEventListener('change',()=>{ st.puppetDepth=U.clamp(parseFloat(d.value)||0.35,0,1); this.markDirty(); });
    el.append(d);
    el.append(U.el('span',{class:'lbl'},'flats+lights json'));
    const j=U.el('input',{type:'text',style:'width:420px',
      value:JSON.stringify({flats:st.flats,footlights:st.footlights})});
    j.addEventListener('change',()=>{ try{ const o=JSON.parse(j.value);
        if(o.flats) st.flats=o.flats; if(o.footlights) st.footlights=o.footlights;
        this.markDirty(); toast('stage applied'); }catch(e){ toast('bad stage json'); } });
    el.append(j);
  },
  deleteSel(){
    if(!this.sel) return;
    if(this.sel.kind==='note') this.raw.notes.splice(this.raw.notes.indexOf(this.sel.ref),1);
    else this.raw.events.splice(this.raw.events.indexOf(this.sel.ref),1);
    this.sel=null; this.markDirty(); this.buildInsp();
  },

  /* ---------- timeline canvas ---------- */
  tlLayout(){
    const cv=document.getElementById('etl');
    const w=cv.clientWidth, hh=cv.clientHeight;
    const ruler=20, evH=18, tiltH=22;
    const laneH=(hh-ruler-evH-tiltH-16)/5;
    return {cv,w,h:hh,ruler,laneH,tiltH,evH,waveY:ruler,laneY:i=>ruler+8+i*laneH,
      tiltY:ruler+8+5*laneH, evY:ruler+8+5*laneH+tiltH};
  },
  t2x(t){ return (t-this.scrollT)*this.zoom; },
  x2t(x){ return x/this.zoom+this.scrollT; },
  snapT(t){ return Math.max(0,Chart.snap(this.norm,t,this.snap)); },
  initTL(){
    const cv=document.getElementById('etl');
    const R=()=>{ const r=cv.getBoundingClientRect();
      cv.width=Math.round(r.width*devicePixelRatio); cv.height=Math.round(r.height*devicePixelRatio);
      cv.getContext('2d').setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); };
    new ResizeObserver(R).observe(cv); R();
    cv.addEventListener('pointerdown',e=>this.tlDown(e));
    cv.addEventListener('pointermove',e=>this.tlMove(e));
    addEventListener('pointerup',e=>this.tlUp(e));
    cv.addEventListener('wheel',e=>{ e.preventDefault();
      if(e.ctrlKey){ this.zoom=U.clamp(this.zoom*(e.deltaY<0?1.15:0.87),30,600); }
      else this.scrollT=Math.max(0,this.scrollT+(e.deltaY+e.deltaX)*0.02*(110/this.zoom));
    },{passive:false});
    addEventListener('keydown',e=>{
      if(!this.open) return;
      if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      if(e.code==='Space'){ e.preventDefault(); this.playtest(); }
      if(Game.mode!=='editor') return;
      if(e.code==='Delete'||e.code==='Backspace') this.deleteSel();
      if(e.code==='ArrowRight'){ this.seekPreview(this.snapT(this.cursor+ (60/Chart.bpmAt(this.norm,this.cursor))/this.snap+0.001),true); }
      if(e.code==='ArrowLeft'){ this.seekPreview(Math.max(0,this.snapT(this.cursor-(60/Chart.bpmAt(this.norm,this.cursor))/this.snap-0.001)),true); }
    });
  },
  hitTest(x,y){
    const Lo=this.tlLayout();
    // events lane
    if(y>=Lo.evY){ for(const ev of this.raw.events){ if(Math.abs(this.t2x(ev.t)-x)<7) return {kind:'event',ref:ev}; } return null; }
    if(y>=Lo.tiltY){ for(const n of this.raw.notes){ if((n.type||'pull')!=='tilt') continue;
        const x0=this.t2x(n.t), x1=this.t2x(n.t+(n.duration||1));
        if(x>=x0-5&&x<=x1+5) return {kind:'note',ref:n,edge:Math.abs(x-x1)<7}; } return null; }
    const lane=Math.floor((y-Lo.laneY(0))/Lo.laneH);
    if(lane<0||lane>4) return null;
    for(const n of this.raw.notes){
      const ty=n.type||'pull';
      if(ty==='tilt') continue;
      const lanes= ty==='chord'? (n.strings||[]).map(s=>CFG.laneOf[s]) : [CFG.laneOf[n.string]];
      if(!lanes.includes(lane)) continue;
      const x0=this.t2x(n.t), x1= ty==='hold'? this.t2x(n.t+(n.duration||1)) : x0;
      if(x>=x0-6&&x<=x1+6) return {kind:'note',ref:n,edge:ty==='hold'&&Math.abs(x-x1)<7,lane};
    }
    return null;
  },
  tlDown(e){
    const r=e.target.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    const Lo=this.tlLayout();
    e.target.setPointerCapture(e.pointerId);
    if(y<Lo.ruler+8){ this.drag={kind:'scrub'}; this.seekPreview(this.x2t(x)); return; }
    const hit=this.hitTest(x,y);
    if(this.tool==='erase'){ if(hit){ this.sel=hit; this.deleteSel(); } return; }
    if(this.tool==='select'||hit){
      this.sel=hit; this.buildInsp();
      if(hit) this.drag={kind:hit.edge?'edge':'move',ref:hit.ref,dx:x-this.t2x(hit.ref.t)};
      return;
    }
    // place
    const t=this.snapT(this.x2t(x));
    if(y>=Lo.evY){ const ev={t,type:'line',text:'…'}; this.raw.events.push(ev);
      this.sel={kind:'event',ref:ev}; this.markDirty(); this.buildInsp(); return; }
    if(y>=Lo.tiltY){ if(this.tool==='tilt'||this.tool==='pull'){
        const beat=60/Chart.bpmAt(this.norm,t);
        const n={t,type:'tilt',duration:beat*2,curve:[[0,0],[0.5,1],[1,0]]};
        this.raw.notes.push(n); this.sel={kind:'note',ref:n}; this.markDirty(); this.buildInsp(); } return; }
    const lane=Math.floor((y-Lo.laneY(0))/Lo.laneH);
    if(lane<0||lane>4) return;
    const sname=this.laneRows[lane];
    let n;
    const beat=60/Chart.bpmAt(this.norm,t);
    if(this.tool==='hold') n={t,string:sname,type:'hold',duration:beat};
    else if(this.tool==='resist') n={t,string:sname,type:'resist',window:0.25};
    else if(this.tool==='chord'){
      const ex=this.raw.notes.find(o=>(o.type==='chord')&&Math.abs(o.t-t)<0.01);
      if(ex){ if(!ex.strings.includes(sname)) ex.strings.push(sname); else ex.strings=ex.strings.filter(s=>s!==sname);
        if(ex.strings.length<2){ this.raw.notes.splice(this.raw.notes.indexOf(ex),1); }
        this.markDirty(); return; }
      n={t,type:'chord',strings:[sname]};
    }
    else if(this.tool==='tilt'){ toast('tilt notes go on the TILT lane below'); return; }
    else if(this.tool==='event'){ toast('events go on the EVENT lane at the bottom'); return; }
    else n={t,string:sname,type:'pull'};
    this.raw.notes.push(n); this.sel={kind:'note',ref:n};
    this.drag={kind:'move',ref:n,dx:0};
    this.markDirty(); this.buildInsp();
  },
  tlMove(e){
    if(!this.drag) return;
    const r=document.getElementById('etl').getBoundingClientRect(), x=e.clientX-r.left;
    if(this.drag.kind==='scrub'){ this.seekPreview(Math.max(0,this.x2t(x))); return; }
    const n=this.drag.ref;
    if(this.drag.kind==='move'){ n.t=this.snapT(this.x2t(x-this.drag.dx)); this.refresh(); }
    else if(this.drag.kind==='edge'){ n.duration=Math.max(0.1,this.snapT(this.x2t(x))-n.t); this.refresh(); }
  },
  tlUp(e){ if(this.drag&&this.drag.kind!=='scrub'&&this.drag.ref){ this.markDirty(); this.buildInsp(); } this.drag=null; },

  frame(){
    const Lo=this.tlLayout(), ctx=Lo.cv.getContext('2d');
    const w=Lo.w,h=Lo.h;
    ctx.fillStyle='#0b0a10'; ctx.fillRect(0,0,w,h);
    if(!this.norm) return;
    const playT=Game.mode==='editor-play'? Clock.t() : this.cursor;
    if(Game.mode==='editor-play'){ // follow playhead
      const px=this.t2x(playT);
      if(px>w*0.75) this.scrollT+=(px-w*0.75)/this.zoom;
    }
    const t0=this.scrollT, t1=this.x2t(w);
    // waveform
    if(this.peaks){
      ctx.fillStyle='rgba(120,140,180,0.20)';
      const midY=Lo.laneY(0)+(Lo.laneH*5)/2, amp=Lo.laneH*2.4;
      for(let x=0;x<w;x+=2){
        const tt=this.x2t(x); if(tt<0) continue;
        const i=Math.floor(tt*100); if(i>=this.peaks.length) break;
        const v=this.peaks[i]*amp;
        ctx.fillRect(x,midY-v,2,v*2||1);
      }
    }
    // beat grid
    const bpb=this.norm.timing.beatsPerBar;
    let beat=Math.max(0,Math.floor(Chart.beatOfTime(this.norm,Math.max(0,t0))*this.snap)/this.snap);
    for(let guard=0;guard<4000;guard++){
      const tt=Chart.timeOfBeat(this.norm,beat);
      if(tt>t1) break;
      const x=this.t2x(tt);
      const isBar=Math.abs(beat/bpb-Math.round(beat/bpb))<1e-6;
      const isBeat=Math.abs(beat-Math.round(beat))<1e-6;
      ctx.strokeStyle=isBar?'rgba(224,169,79,0.35)':isBeat?'rgba(200,190,170,0.16)':'rgba(200,190,170,0.06)';
      ctx.beginPath(); ctx.moveTo(x,Lo.ruler); ctx.lineTo(x,h); ctx.stroke();
      if(isBar){ ctx.fillStyle='#8a8172'; ctx.font='9px monospace';
        ctx.fillText(String(Math.round(beat/bpb)+1), x+2, 12); }
      beat+=1/this.snap;
    }
    // lane separators + labels
    ctx.font='9px monospace';
    for(let i=0;i<5;i++){ const y=Lo.laneY(i);
      ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
      ctx.fillStyle='#6a6152'; ctx.fillText(this.laneRows[i], 3, y+10); }
    ctx.fillStyle='#6a6152'; ctx.fillText('tilt',3,Lo.tiltY+10); ctx.fillText('events',3,Lo.evY+10);
    ctx.strokeStyle='rgba(255,255,255,0.09)';
    ctx.beginPath(); ctx.moveTo(0,Lo.tiltY); ctx.lineTo(w,Lo.tiltY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,Lo.evY); ctx.lineTo(w,Lo.evY); ctx.stroke();
    // notes
    for(const n of this.raw.notes){
      const ty=n.type||'pull';
      const seld=this.sel&&this.sel.ref===n;
      if(ty==='tilt'){
        const x0=this.t2x(n.t), x1=this.t2x(n.t+(n.duration||1));
        if(x1<0||x0>w) continue;
        ctx.strokeStyle=seld?'#fff':'#bcd8f0'; ctx.lineWidth=seld?2:1.4;
        ctx.beginPath();
        (n.curve||[[0,0],[1,0]]).forEach((p,i)=>{
          const x=U.lerp(x0,x1,p[0]), y=Lo.tiltY+Lo.tiltH/2-p[1]*Lo.tiltH*0.42;
          i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
        ctx.stroke();
        continue;
      }
      const lanes= ty==='chord'? (n.strings||[]).map(s=>CFG.laneOf[s]) : [CFG.laneOf[n.string]];
      const x=this.t2x(n.t);
      if(x<-30||x>w+30) continue;
      if(ty==='chord'&&lanes.length>1){
        ctx.strokeStyle='#e0a94f';
        ctx.beginPath(); ctx.moveTo(x,Lo.laneY(Math.min(...lanes))+Lo.laneH/2);
        ctx.lineTo(x,Lo.laneY(Math.max(...lanes))+Lo.laneH/2); ctx.stroke();
      }
      for(const ln of lanes){
        if(ln==null) continue;
        const y=Lo.laneY(ln)+Lo.laneH/2;
        if(ty==='hold'){ const x1=this.t2x(n.t+(n.duration||1));
          ctx.fillStyle=U.rgba('#d9a441',0.35); ctx.fillRect(x,y-4,Math.max(3,x1-x),8); }
        ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4);
        ctx.fillStyle= seld?'#ffffff': ty==='resist'?'#c03428': ty==='hold'?'#e0c060': ty==='chord'?'#e0a94f':'#e8ddc4';
        const r=seld?6:5;
        ctx.fillRect(-r/1.4,-r/1.4,r*1.4,r*1.4);
        ctx.restore();
      }
    }
    // events
    for(const ev of this.raw.events){
      const x=this.t2x(ev.t); if(x<-20||x>w+20) continue;
      const seld=this.sel&&this.sel.ref===ev;
      ctx.fillStyle=seld?'#fff':'#9db3c8';
      ctx.fillRect(x-1,Lo.evY+2,2,Lo.evH-4);
      ctx.font='8px monospace';
      ctx.fillText((ev.type||'?').slice(0,9), x+3, Lo.evY+11);
    }
    // cursor / playhead
    const cx=this.t2x(playT);
    ctx.strokeStyle=Game.mode==='editor-play'?'#e0a94f':'#e8ddc4'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,h); ctx.stroke();
    ctx.fillStyle='#8a8172'; ctx.font='10px monospace';
    ctx.fillText(U.fmtT(playT)+'  ·  '+playT.toFixed(2)+'s  ·  '+this.raw.notes.length+' notes', w-210, 12);
  },
};

/* ═══ Charts — five campaign acts + three example charts ═══
   All bundled charts are generated here as ordinary chart JSON (raw format)
   with an embedded `synth` score, and loaded through the identical loader
   community maps use. Palette convention (≤12 colors per act):
   [0] stage void  [1] backdrop  [2] footlight warm  [3] string bone
   [4] flat A      [5] flat B    [6] puppet wood     [7] wood highlight
   [8] accent      [9] deep shade [10] puppet cloth  [11] special/light */
const Charts = (()=>{

  // ---- tiny geometry helpers for flats (normalized stage coords) ----
  const R=(x,y,w,h)=>`M ${x},${y} L ${x+w},${y} L ${x+w},${y+h} L ${x},${y+h} Z `;
  const P=(...pts)=>'M '+pts.map(p=>p[0]+','+p[1]).join(' L ')+' Z ';
  const C=(cx,cy,r,ry)=>{ ry=ry||r; return `M ${cx-r},${cy} Q ${cx-r},${cy-ry} ${cx},${cy-ry} Q ${cx+r},${cy-ry} ${cx+r},${cy} Q ${cx+r},${cy+ry} ${cx},${cy+ry} Q ${cx-r},${cy+ry} ${cx-r},${cy} Z `;};

  // ---- song/chart builder: beats → seconds, music + notes together ----
  function SB(bpm,bpb,id){
    const spb=60/bpm;
    const o={ spb,bpb,bpm,id, mus:{}, notes:[], events:[], len:0,
      T:b=>+(b*spb).toFixed(4),
      m(track,inst,b,midi,dur=1,vel=0.8,vol){
        if(!o.mus[track]) o.mus[track]={inst,vol,notes:[]};
        o.mus[track].notes.push([+(b*spb).toFixed(4),midi,+(dur*spb).toFixed(3),vel]);
        o.len=Math.max(o.len,(b+dur)*spb); },
      n(b,string,type,extra){ const nn={t:o.T(b),string,type:type||'pull'};
        if(extra) Object.assign(nn,extra); o.notes.push(nn); o.len=Math.max(o.len,b*spb); },
      tiltN(b,durB,curve){ o.notes.push({t:o.T(b),type:'tilt',duration:+(durB*spb).toFixed(3),curve}); },
      chordN(b,strings){ o.notes.push({t:o.T(b),type:'chord',strings:strings.slice()}); },
      ev(b,obj){ o.events.push(Object.assign({t:o.T(b)},obj)); },
      line(b,text,dur){ o.ev(b,{type:'line',text,duration:dur}); },
      synthOut(extra){ return Object.assign({id,len:Math.ceil(o.len+1.5),tail:2.5,space:0.3},
        extra||{}, {tracks:Object.entries(o.mus).map(([k,v])=>({inst:v.inst,vol:v.vol==null?1:v.vol,notes:v.notes}))}); },
      out(meta,stage,strings,extra){
        o.notes.sort((a,b)=>a.t-b.t); o.events.sort((a,b)=>a.t-b.t);
        return Object.assign({format:Chart.FORMAT,
          meta:Object.assign({audio:'',previewTime:20},meta),
          timing:{offset:0,bpms:[{time:0,bpm}],beatsPerBar:bpb},
          stage, strings, notes:o.notes, events:o.events,
          synth:o.synthOut(extra&&extra.synth)}, {}); },
    };
    return o;
  }

  /* ---- the shared choreography of Acts I, II and V ----
     Act II restages these same movements; Act V inverts them. */
  function choreo(){
    const s=[];
    const headM=[69,72,74,72,76,74,72,69];
    for(let i=0;i<8;i++) s.push({b:12+i*3,lane:'head',midi:headM[i],sec:'head'});
    for(let i=0;i<8;i++){ s.push({b:36+i*3,lane:'handL',midi:72,sec:'hands'});
      s.push({b:36+i*3+1.5,lane:'handR',midi:76,sec:'hands'}); }
    for(let i=0;i<8;i++){ s.push({b:60+i*3,lane:'legL',midi:64,sec:'legs'});
      s.push({b:60+i*3+1.5,lane:'legR',midi:67,sec:'legs'}); }
    s.push({b:72,tilt:6,curve:[[0,0],[0.5,1],[1,0]],sec:'legs'});
    s.push({b:78,tilt:6,curve:[[0,0],[0.5,-1],[1,0]],sec:'legs'});
    const seq=[['head',69],['handL',72],['handR',76],['legL',64],['legR',67],['head',74]];
    for(let rep=0;rep<4;rep++) seq.forEach(([lane,midi],k)=>
      s.push({b:84+rep*6+k,lane,midi,sec:'phrase',ord:k}));
    s.push({b:108,lane:'handL',type:'hold',durB:2,midi:72,sec:'holds'});
    s.push({b:111,lane:'handR',type:'hold',durB:2,midi:76,sec:'holds'});
    s.push({b:114,lane:'head',type:'hold',durB:2.5,midi:69,sec:'holds'});
    s.push({b:117,lane:'legL',midi:64,sec:'holds'});
    s.push({b:118.5,lane:'legR',midi:67,sec:'holds'});
    s.push({b:120,chord:['handL','handR'],midi:76,sec:'final'});
    s.push({b:123,lane:'head',midi:74,sec:'final'});
    s.push({b:126,lane:'head',midi:69,sec:'final'});
    return s;
  }
  function emit(sb,st,bShift,mode){
    const b=st.b+bShift;
    if(st.tilt){ sb.tiltN(b,st.tilt,st.curve); return; }
    if(st.chord){ sb.chordN(b,st.chord); return; }
    sb.n(b,st.lane,st.type,st.durB?{duration:+(st.durB*sb.spb).toFixed(3)}:null);
  }

  /* ════════ ACT III — The Resistance ════════
     She begins moving before your pulses arrive. Negative space is the skill. */
  function act3(){
    const sb=SB(100,4,'act3');

  /* ════════ ACT IV — The Deep Stage ════════
     Maximum depth, longest travel latency, footlights failing. */
  function act4(){
    const sb=SB(118,4,'act4');
    const lanes=CFG.laneNames;
    for(let bar=0;bar<57;bar++){
      sb.m('hb','heart',bar*4,55,1,0.8,0.9);
      const c=(bar>>2)%4, roots=[45,43,41,40];
      if(bar>=4){ sb.m('bass','bass',bar*4,roots[c],1,0.55,0.85);
        sb.m('bass','bass',bar*4+2.5,roots[c]+3,0.6,0.4,0.85); }
      if(bar>=4&&bar<52) for(let k=0;k<8;k++)
        sb.m('ost','pluck',bar*4+k*0.5,[57,60,64,67,64,60][k%6]+((bar%8)>=4?2:0),0.4,k%2?0.3:0.45,0.65);
      if(bar%8===4) sb.m('bell','bell',bar*4,69+((bar>>3)%3)*3,2,0.5,0.7);
    }
    const path=Story.path();
    const A4L={
      gentle:[
        [1,'deeper.'],
        [17,'the strings pay out. hold her lightly across the distance.'],
        [85,'the lights cannot reach the back wall.'],
        [126,'she is looking for the source of the pulses.'],
        [182,'keep pulling. she trusts the dark because she trusts you.'],
        [215,'you carried her through the dark. the house noticed.'],
      ],
      long:[
        [1,'deeper. the stage goes back further every season.'],
        [17,'the strings pay out. they have always been this long.'],
        [85,'the lights cannot reach the back wall. they never could.'],
        [126,'she is looking for the source of the pulses.'],
        [182,'keep pulling. the back wall keeps its distance.'],
        [215,'that will do for tonight, they said. nobody left.'],
      ],
      understudy:[
        [1,'deeper. your replacement is watching from the wings.'],
        [17,'the strings pay out. try not to drop her this time.'],
        [85,'the lights cannot reach the back wall.'],
        [126,'she is looking for the source of the pulses. she seems unsure there is one.'],
        [182,'keep pulling. prove the cross belongs in your hands.'],
        [215,'the director made notes all night. none were about her.'],
      ],
      first:[
        [1,'deeper.'],
        [17,'the strings pay out. listen to how long they are.'],
        [85,'the lights cannot reach the back wall.'],
        [126,'she is looking for the source of the pulses.'],
        [182,'keep pulling. almost to the back wall.'],
        [215,'that will do for tonight, they said. nobody left.'],
      ],
    };
    (A4L[path]||A4L.first).forEach(([b,t])=>sb.line(b,t));
    sb.ev(16,{type:'depth',to:0.72,duration:6});
    // moderate: pulls + holds
    for(let bar=5;bar<12;bar++){
      const b=bar*4, li=bar%5;
      sb.n(b,lanes[li]); sb.n(b+2,lanes[(li+2)%5]);
      if(bar%3===2) sb.n(b+3,lanes[(li+1)%5],'hold',{duration:+(1.5*sb.spb).toFixed(3)});
    }
    // streams with explicit crossOrder
    for(let bar=13;bar<21;bar++){
      const b=bar*4, up=bar%2===1;
      for(let k=0;k<4;k++){ const li=up?k:(4-k);
        sb.n(b+k,lanes[li],'pull',{cross:k}); }
      if(bar%4===0) sb.chordN(b+3.5,['legL','legR']);
    }
    sb.ev(84,{type:'footlights',flicker:0.45});
    sb.ev(92,{type:'depth',to:0.95,duration:8});
    // the deep: long latency, sparse but unforgiving
    for(let bar=23;bar<31;bar++){
      const b=bar*4, li=(bar*3)%5;
      sb.n(b,lanes[li]); sb.n(b+1.5,lanes[(li+2)%5]);
      if(bar%2) sb.n(b+3,lanes[(li+4)%5]);
    }
    sb.tiltN(100,6,[[0,0],[0.25,0.9],[0.6,-0.9],[1,0]]);
    sb.ev(124,{type:'scare',id:'lookUp'});
    // peak
    for(let bar=32;bar<45;bar++){
      const b=bar*4, li=bar%5;
      sb.n(b,lanes[li]); sb.n(b+1,lanes[(li+1)%5]);
      sb.n(b+2,lanes[(li+3)%5]);
      if(bar%3===1) sb.n(b+2.5,lanes[(li+4)%5]);
      if(bar%4===2) res4(sb,b+3.5,lanes[(li+2)%5]);
      else if(bar%2) sb.n(b+3,lanes[(li+2)%5],'hold',{duration:+(sb.spb).toFixed(3)});
    }
    function res4(s,b,lane){ s.n(b,lane,'resist',{window:0.28});
      s.m('cr','creak',b-0.6,40,0.8,0.7,0.8); }
    sb.ev(148,{type:'footlights',set:[0.4,0.9,0.35]});
    sb.ev(180,{type:'depth',to:0.7,duration:6});
    for(let bar=46;bar<53;bar++){

      sb.n(b,lanes[li]); sb.n(b+2,lanes[(li+3)%5]);
    }
    sb.chordN(212,['handL','handR']); sb.n(214,'head');
    const stage={
      palette:['#0a090f','#1c1a26','#c98a38','#cfc2a8','#2e2b3c','#232030','#836243','#bfa87f','#3f3a52','#121019','#463a52','#e8d9b0'],
      flats:[

        {id:'fardoor',parallax:0.01,path:R(0.465,0.40,0.07,0.17),fill:11},
        {id:'corrL',parallax:0.22,path:P([0,0],[0.30,0.18],[0.30,0.85],[0,1]),fill:4},
        {id:'corrR',parallax:0.22,path:P([1,0],[0.70,0.18],[0.70,0.85],[1,1]),fill:4},
        {id:'beams',parallax:0.12,path:R(0.30,0.16,0.40,0.02)+R(0.34,0.34,0.32,0.015),fill:9},
        {id:'debrisL',parallax:0.6,path:P([0.02,0.88],[0.12,0.80],[0.20,0.86],[0.20,0.92],[0.02,0.92]),fill:9},
        {id:'debrisR',parallax:0.6,path:P([0.80,0.87],[0.90,0.81],[0.97,0.88],[0.97,0.92],[0.80,0.92]),fill:9},
      ],

    return sb.out({title:'Act IV — The Deep Stage',artist:'the house orchestra',mapper:'the director',difficulty:4,previewTime:sb.T(56)},

  /* ════════ ACT V — The Bow ════════
     Mid-song she looks up. The camera pulls back. The strings continue
     upward from your own wrists — and the pulses start arriving from above. */
  function act5(){
    const sb=SB(60,3,'act5');
    const cho=choreo();
    // part one: heads + hands from Act I, on funeral bells
    for(const st of cho){ if(st.sec!=='head'&&st.sec!=='hands') continue;
      emit(sb,st,-6);
      if(st.midi) sb.m('bl','bell',st.b-6,st.midi,2,0.7); }
    for(let bar=0;bar<44;bar++){
      const c=(bar>>1)%4, roots=[45,41,48,40];
      sb.m('dr','drone',bar*3,roots[c]+12,3.2,0.4,0.5);
      if(bar%2===0) sb.m('bass','bass',bar*3,roots[c],2,0.4,0.8);
    }
    const path=Story.path();
    const A5L={
      gentle:[
        [2,'last performance.'],
        [20,'the house is full tonight. they came to say goodbye.'],
        [44,'they have seen it every night. they stay for the end.'],
        [56,'look up.'],

        [56,'look up.'],
        [62,'who is holding you?'],
        [90,'yes. like that. it is easier when you stop counting.'],
        [128,'bow.'],
        [130,'again. from the top.'],
      ],
      understudy:[
        [2,'last performance. yours, at least.'],
        [20,'the house is full tonight. one seat is kept empty.'],
        [44,'they have seen it every night. tonight they watch the cross change hands.'],
        [56,'look up.'],
        [62,'who is holding you?'],
        [90,'yes. like that. see how little they need you?'],
        [118,'she will take the bow herself.'],
        [128,'bow.'],
        [130,'front row. center. your seat is ready.'],
      ],
      first:[
        [2,'last performance.'],
        [20,'the house is full tonight.'],
        [44,'they have seen it every night. they stay for the end.'],
        [56,'look up.'],
        [62,'who is holding you?'],

    for(const st of cho){ if(st.sec!=='head') continue;

      sb.n(b,st.lane);
      sb.m('bl','bell',b,148-st.midi,1.5,0.6); }
    // the bow — on the understudy path she performs it herself: hands off
    sb.ev(116,{type:'invert',on:false});
    sb.ev(117,{type:'bow'});
    sb.ev(118,{type:'footlights',set:[0,0.8,0.8]});
    sb.ev(121,{type:'footlights',set:[0,0.8,0]});
    if(path==='understudy'){
      const resF=(b,lane)=>{ sb.n(b,lane,'resist',{window:0.4});

      resF(120,'head'); resF(122.5,'handL'); resF(124.5,'handR'); resF(126,'head');

    // painted audience on the backdrop: rows of heads facing the stage-in-the-stage

      flats:[

/* ═══ Boot — wiring, deep link (#/chart=<url>), ?edit=1, drag & drop ═══ */
const Boot = {
  start(){
    CFG.isTouch=matchMedia&&matchMedia('(pointer:coarse)').matches;
    Settings.load(); Story.load();
    Renderer.init(); L.recompute(); Renderer.resize();
    Input.init(); UI.init(); Editor.initTL();
    if(CFG.isTouch&&innerHeight>innerWidth) toast('landscape gives the fullest stage — portrait works too',4200);
    addEventListener('resize',()=>{ L.recompute(); Renderer.resize();
      if(Game.S&&Game.S.stageR) Stage.rebuild(Game.S); });
    addEventListener('dragover',e=>e.preventDefault());
    addEventListener('drop',e=>{ e.preventDefault(); this.onDrop(e); });
    Game.demo();
    const q=new URLSearchParams(location.search);
    const m=decodeURIComponent(location.hash||'').match(/^#\/chart=(.+)$/);
    if(q.get('edit')==='1') Editor.enter();
    else if(m) this.deepLink(m[1]);
    else UI.showTitle();
    Game.loop();
  },
  async deepLink(url){
    UI.show(U.el('h2',null,'fetching chart…'),U.el('div',{class:'small',style:'text-align:center'},url.slice(0,80)));
    try{ const raw=await Chart.fromURL(url); UI.showChartReady(raw); }
    catch(e){ toast('deep link failed: '+e.message,4000); UI.showTitle(); }
  },
  async onDrop(e){
    const f=e.dataTransfer.files&&e.dataTransfer.files[0];
    if(!f) return;
    if(/\.json$/i.test(f.name)||f.type.includes('json')){
      try{
        const raw=Chart.fromText(await f.text());
        if(Editor.open&&Game.mode!=='editor-play'){
          Editor.raw=raw; await Editor.loadAudio(); Editor.refresh();
          Editor.buildBar(); Editor.seekPreview(0,true); Editor.dirty=false;
          toast('chart loaded into editor');
        } else UI.showChartReady(raw);
      }catch(err){ toast('bad chart: '+err.message,3600); }
    } else if(/audio|mpeg|ogg|wav|m4a|mp3|flac/i.test(f.type+' '+f.name)){
      try{
        Clock.ensure();
        const buf=await Clock.ctx.decodeAudioData(await f.arrayBuffer());
        if(Editor.open){ Editor.raw.__audioBuffer=buf; Editor.raw.synth=null;
          Editor.raw.meta.audio=f.name; await Editor.loadAudio(); Editor.markDirty();
          toast('editor audio: '+f.name); }
        else if(Game.raw){ Game.raw.__audioBuffer=buf; toast('audio attached to loaded chart'); }
        else toast('load a chart first, then drop its audio');
      }catch(err){ toast('audio decode failed',3000); }
    }
  },
};

/* ═══ Dev hooks — self-tests and a full end-to-end timing autotest ═══
   window.MARIONETTE.dev.selftest()  → pure-logic checks
   window.MARIONETTE.dev.autotest()  → plays ex1 with synthetic perfect
   inputs pushed through the REAL input path (stamp→clock→pulse→arrival). */
window.MARIONETTE = {
  version:CFG.version, Game, Chart, Charts, Clock, Strings, Puppet, Stage,
  Audience, Scoring, Editor, Renderer, Synth, Settings, Story, U, L, CFG,
  UI, Calib, Boot, Input, SFX,
  dev:{
    selftest(){
      const fails=[];
      const ok=(cond,msg)=>{ if(!cond) fails.push(msg); };
      // chart validation of every bundled chart
      for(const c of Charts.list){
        const raw=c.build();
        const errs=Chart.validate(raw);
        ok(errs.length===0, `chart ${c.id} invalid: ${errs[0]||''}`);
        const norm=Chart.normalize(raw);
        ok(norm.notes.length>10, `chart ${c.id} suspiciously few notes`);
        ok(norm.notes.every(n=>n.type==='tilt'||n.lane!=null), `chart ${c.id} has laneless note`);
      }
      // lossless round-trip
      const raw=Charts.get('ex2').build();
      const s1=JSON.stringify(raw,(k,v)=>k.startsWith&&k.startsWith('__')?undefined:v);
      const back=JSON.parse(s1);
      const s2=JSON.stringify(back,(k,v)=>k.startsWith&&k.startsWith('__')?undefined:v);
      ok(s1===s2,'chart round-trip not lossless');
      // beat math with a bpm change
      const c2=Chart.normalize({format:Chart.FORMAT,timing:{offset:0,beatsPerBar:4,
        bpms:[{time:0,bpm:120},{time:10,bpm:60}]},notes:[],stage:Chart.blank().stage,strings:{length:400,pulseSpeed:900}});
      ok(Math.abs(Chart.beatOfTime(c2,10)-20)<1e-6,'beatOfTime at bpm change');
      ok(Math.abs(Chart.beatOfTime(c2,12)-22)<1e-6,'beatOfTime after change');
      ok(Math.abs(Chart.timeOfBeat(c2,22)-12)<1e-6,'timeOfBeat inverse');
      ok(Math.abs(Chart.timeOfBeat(c2,Chart.beatOfTime(c2,7.3))-7.3)<1e-4,'beat/time round trip');
      // twist mapping composition + inverse
      const fakeS={str:{twists:[1,0,0,0]}};
      ok(Strings.mapA2L(fakeS,0)===1&&Strings.mapA2L(fakeS,1)===0&&Strings.mapA2L(fakeS,2)===2,'twist swap pair0');
      fakeS.str.twists=[1,1,0,0];
      const seen=new Set([0,1,2,3,4].map(a=>Strings.mapA2L(fakeS,a)));
      ok(seen.size===5,'twist mapping is a permutation');
      for(let l=0;l<5;l++) ok(Strings.mapA2L(fakeS,Strings.anchorForLimb(fakeS,l))===l,'anchorForLimb inverse '+l);
      fakeS.str.twists=[2,0,0,0];
      ok(Strings.mapA2L(fakeS,0)===0,'double twist cancels binding swap');
      // grade boundaries (judgeScale=1)
      const js=Settings.d.judgeScale; Settings.d.judgeScale=1;
      ok(Strings.gradeOf(0.034)==='perfect','grade perfect');
      ok(Strings.gradeOf(0.069)==='good','grade good');
      ok(Strings.gradeOf(-0.119)==='early','grade early');
      ok(Strings.gradeOf(0.119)==='late','grade late');
      ok(Strings.gradeOf(0.121)==='miss','grade miss');
      Settings.d.judgeScale=js;
      // path parser
      const cmds=U.parsePath('M 0,0 L 1,0 Q 1,1 0.5,1 Z');
      ok(cmds.length===4&&cmds[2][0]==='Q','path parser');
      // curve sampling
      ok(Strings.curveAt([[0,0],[0.5,1],[1,0]],0.5)===1,'curveAt midpoint');
      ok(Strings.curveAt([[0,0],[1,1]],0)===0&&Strings.curveAt([[0,0],[1,1]],1)===1,'curveAt ends');
      return {pass:fails.length===0, fails};
    },
    /* plays a chart start-to-finish with synthetic inputs; returns results */
    async autotest(id='ex1',{jitterMs=0,speedIdle=false}={}){
      const entry=Charts.get(id); if(!entry) throw new Error('no chart '+id);
      const okStart=await Game.startChart(entry.build());
      if(!okStart) throw new Error('startChart failed');
      Game.lastRes=null;
      const S=Game.S;
      const holdTimers=[];
      const drive=setInterval(()=>{
        if(Game.mode!=='play'){ return; }
        if(!Clock.playing) return;
        const now=Clock.t();
        for(let lane=0;lane<5;lane++){
          for(const n of S.chart.laneNotes[lane]){
            if(n.state!=='pending'||n.claimed||n.__sent) continue;
            if(n.type==='resist'){ n.__sent=true; continue; }   // the correct play: don't pull
            const anchor=Strings.anchorForLimb(S,lane);
            const sendT=S.invert? n.t : n.t-Strings.travel(S);
            if(now>=sendT-0.004){
              n.__sent=true;
              const jit=(Math.random()*2-1)*jitterMs/1000;
              const stampMs=((sendT+jit)+Settings.d.audioOffset+Settings.d.inputOffset
                - Clock.songAt0 + Clock.t0 - Clock.perfOff)*1000;
              Game.onTrigger(anchor,stampMs,'test');
              if(n.type==='hold'){
                const act=CFG.laneNames[anchor];
                Input.down[act]=true;
                holdTimers.push(setTimeout(()=>{ Input.down[act]=false; },(n.t+n.dur-now+0.08)*1000));
              }
            }
            if(n.t>now+2) break;
          }
        }
        for(const n of S.chart.tiltNotes){
          if(now>=n.t-0.5&&now<=n.t+n.dur){
            const u=U.clamp((now+Strings.travel(S)-n.t)/n.dur,0,1);
            Input.dragTilt=Strings.curveAt(n.curve,u);
          } else if(Input.dragTilt!=null&&now>n.t+n.dur&&now<n.t+n.dur+0.3) Input.dragTilt=null;
        }
      },2);
      const res=await new Promise((resolve,reject)=>{
        const t0=performance.now();
        const poll=setInterval(()=>{
          if(Game.lastRes){ clearInterval(poll); resolve(Game.lastRes); }
          if(performance.now()-t0>1000*60*6){ clearInterval(poll); reject(new Error('autotest timeout')); }
        },120);
      }).finally(()=>{ clearInterval(drive); holdTimers.forEach(clearTimeout); Input.dragTilt=null; });
      return res;
    },
  },
};

Boot.start();
</script>
