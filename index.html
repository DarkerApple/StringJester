<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MARIONETTE</title>
<meta name="description" content="MARIONETTE — a 2D horror rhythm game for five strings. Single file, no dependencies.">
<meta name="theme-color" content="#040409">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --amber:#e0a94f; --ink:#07070c; --bone:#e6dac2; --dim:#7a7160; --line:#2c2620;
  --red:#8e2f2a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#040409;overflow:hidden}
body{font-family:Georgia,'Times New Roman',serif;color:var(--bone);-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;display:block;touch-action:none;cursor:default;background:#040409}
/* ---------- UI overlay ---------- */
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:20}
#ui.hidden{display:none}
.panel{pointer-events:auto;background:rgba(7,7,12,.92);border:1px solid var(--line);
  padding:26px 34px;max-width:min(760px,94vw);max-height:88vh;overflow:auto;
  box-shadow:0 0 90px rgba(0,0,0,.9), inset 0 0 40px rgba(0,0,0,.5)}
.panel::-webkit-scrollbar{width:8px}.panel::-webkit-scrollbar-thumb{background:#2c2620}
h1.title{font-weight:400;letter-spacing:.44em;font-size:clamp(26px,5vw,44px);color:var(--bone);
  text-align:center;margin:6px 0 2px;text-indent:.44em;text-shadow:0 0 24px rgba(224,169,79,.25)}
.sub{letter-spacing:.3em;text-align:center;color:var(--dim);font-size:12px;text-transform:uppercase;margin-bottom:22px}
h2{font-weight:400;letter-spacing:.3em;font-size:17px;text-transform:uppercase;color:var(--amber);margin:0 0 16px;text-align:center}
h3{font-weight:400;letter-spacing:.2em;font-size:13px;text-transform:uppercase;color:var(--amber);margin:18px 0 6px}
.btn{display:block;width:100%;background:none;border:1px solid #3a332a;color:var(--bone);
  letter-spacing:.22em;padding:11px 22px;cursor:pointer;font:inherit;text-transform:uppercase;
  font-size:14px;margin:8px 0;text-align:center;transition:all .15s}
.btn:hover:not(:disabled){background:#191308;border-color:var(--amber);color:var(--amber)}
.btn:disabled{opacity:.35;cursor:default}
.btn.small{font-size:11px;padding:7px 12px;letter-spacing:.16em}
.btn.inline{display:inline-block;width:auto}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:7px 0;flex-wrap:wrap}
.row label{color:var(--dim);letter-spacing:.12em;font-size:13px;text-transform:uppercase}
.grade{font-size:84px;text-align:center;color:var(--amber);letter-spacing:.1em;line-height:1;margin:10px 0;text-shadow:0 0 40px rgba(224,169,79,.4)}
.stats{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
.stats td{padding:4px 10px;border-bottom:1px solid #1c1813}
.stats td:last-child{text-align:right;color:var(--amber)}
.small,small{font-size:12px;color:var(--dim);line-height:1.55}
.storyline{font-style:italic;color:#b9a988;text-align:center;margin:14px 0;letter-spacing:.06em;line-height:1.6}
kbd{display:inline-block;border:1px solid #4a4136;border-bottom-width:2px;padding:1px 7px;margin:0 2px;
  font:12px monospace;color:var(--bone);background:#14100c;border-radius:3px;min-width:24px;text-align:center}
input[type=text],input[type=url],input[type=number],select,textarea{
  background:#0d0b10;border:1px solid #2c2620;color:var(--bone);font:13px monospace;padding:6px 8px;outline:none}
input[type=range]{accent-color:var(--amber);width:170px}
input[type=color]{width:26px;height:22px;border:1px solid #2c2620;background:none;padding:0;cursor:pointer}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
textarea{width:100%;resize:vertical}
a{color:var(--amber)}
.actrow{display:flex;gap:10px;align-items:center;border:1px solid #241f19;padding:10px 14px;margin:7px 0;cursor:pointer;transition:all .15s}
.actrow:hover{border-color:var(--amber);background:#120e08}
.actrow.locked{opacity:.38;cursor:default}
.actrow.locked:hover{border-color:#241f19;background:none}
.actrow .num{font-size:22px;color:var(--dim);width:30px;text-align:center}
.actrow .nm{flex:1}
.actrow .nm b{display:block;letter-spacing:.18em;font-weight:400;text-transform:uppercase;font-size:14px}
.actrow .nm span{font-size:11px;color:var(--dim);letter-spacing:.08em}
.actrow .gr{font-size:24px;color:var(--amber);width:36px;text-align:center}
.keycap{cursor:pointer}
.keycap.listening{border-color:var(--amber);color:var(--amber);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
hr{border:none;border-top:1px solid #1c1813;margin:16px 0}
details{margin:10px 0}
summary{cursor:pointer;color:var(--amber);letter-spacing:.14em;font-size:13px;text-transform:uppercase}
pre{background:#0b0a10;border:1px solid #1c1813;padding:10px;font-size:11px;overflow:auto;color:#b9ae95;max-height:300px}
/* ---------- toast ---------- */
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(10,9,14,.94);
  border:1px solid #3a332a;color:var(--bone);padding:9px 22px;font-size:13px;letter-spacing:.1em;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
/* ---------- editor ---------- */
#edit{position:fixed;left:0;right:0;bottom:0;background:#0a090f;border-top:1px solid var(--line);
  display:none;flex-direction:column;z-index:30;box-shadow:0 -10px 60px rgba(0,0,0,.8)}
#edit.show{display:flex}
#etl{display:block;width:100%;height:210px;cursor:crosshair;touch-action:none}
.ebar{display:flex;gap:5px;padding:6px 10px;align-items:center;flex-wrap:wrap;font:11px monospace;color:#cfc4ad;border-bottom:1px solid #17130f}
.ebar .sep{width:1px;height:18px;background:#2c2620;margin:0 4px}
.ebtn{background:#100d13;border:1px solid #2c2620;color:#cfc4ad;font:11px monospace;padding:4px 9px;cursor:pointer}
.ebtn:hover{border-color:var(--amber);color:var(--amber)}
.ebtn.on{background:#241b0c;border-color:var(--amber);color:var(--amber)}
.ebar input[type=text],.ebar input[type=number],.ebar select{font-size:11px;padding:3px 6px}
.ebar .lbl{color:#6a6152;margin-left:6px}
#einsp{border-top:1px solid #17130f;border-bottom:none;min-height:34px}
.btn,.ebtn,select,input,kbd.keycap{touch-action:manipulation}
@media (max-width:640px){
  .panel{padding:16px 14px;max-width:96vw;max-height:84vh}
  h1.title{letter-spacing:.28em;font-size:clamp(22px,7vw,30px);text-indent:.28em}
  h2{font-size:15px;letter-spacing:.2em}
  .btn{padding:13px 10px;font-size:13px;letter-spacing:.14em}
  .actrow{padding:9px 8px;gap:7px}
  .actrow .nm b{font-size:12px;letter-spacing:.1em}
  .stats{font-size:12px}
  #etl{height:150px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="edit">
  <div class="ebar" id="ebar"></div>
  <canvas id="etl"></canvas>
  <div class="ebar" id="einsp"></div>
</div>
<div id="toast"></div>
<input type="file" id="filein" style="display:none">
<script>
"use strict";
/* ═════════════════════════════════════════════════════════════════════════
   MARIONETTE — a 2D horror rhythm game for five strings.
   One file. Canvas 2D. No dependencies, no external assets.
   Modules: Clock · Chart · Input · Strings · Puppet · Stage · Audience ·
            Scoring · Editor · Renderer  (+ Synth, Settings, Story, UI, Game)
   The signature mechanic: pulses travel down the strings at finite speed.
     arrivalTime = inputTime + stringLength / pulseSpeed
   Judgment is ALWAYS evaluated against arrivalTime, never inputTime.
   ═════════════════════════════════════════════════════════════════════════ */

/* ═══ MODULE: CFG — global constants ═══ */
const CFG = {
  updateHz: 120, updateDt: 1/120,
  judge: { perfect: 0.035, good: 0.070, edge: 0.120, capture: 0.24 },
  leadRing: 1.1,            // seconds the anchor ring cue runs before departure
  spamWin: 0.085,           // adjacent triggers within this → tangle
  crossWin: 0.28,           // cross-order violation window
  maxTwists: 3,
  holdOkFrac: 0.82,         // fraction of a hold that must stay tensioned
  tiltTol: 0.30,            // tilt error tolerance (lean units)
  idleAfter: 4.0,           // seconds without input before idle-frames accrue
  laneNames: ['handL','legL','head','legR','handR'],  // crossbar order, left→right
  laneOf: {handL:0, legL:1, head:2, legR:3, handR:4},
  depthScale: d => 0.72 + 0.85*d,   // string length multiplier vs puppetDepth
  isTouch:false,                    // set at boot from pointer:coarse
  version: '1.1.0',
};

/* ═══ MODULE: U — utilities ═══ */
const U = {
  clamp:(v,a,b)=>v<a?a:(v>b?b:v),
  lerp:(a,b,t)=>a+(b-a)*t,
  ilerp:(a,b,v)=>(v-a)/(b-a),
  ease:t=>t<.5?2*t*t:1-((-2*t+2)**2)/2,
  easeOut:t=>1-(1-t)**2,
  easeIn:t=>t*t,
  easeOutBack:t=>{const c=1.70158;return 1+ (c+1)*((t-1)**3)+c*((t-1)**2)},
  smooth:(t)=>t*t*(3-2*t),
  fract:v=>v-Math.floor(v),
  sgn:v=>v<0?-1:1,
  dist:(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1),
  // deterministic rng
  rng(seed){ let s=seed>>>0 || 1; return ()=>{ s=Math.imul(s^(s>>>15), s|1); s^=s+Math.imul(s^(s>>>7), s|61); return ((s^(s>>>14))>>>0)/4294967296; }; },
  deep:o=>JSON.parse(JSON.stringify(o)),
  eq:(a,b)=>JSON.stringify(a)===JSON.stringify(b),
  // color helpers -----------------------------------------------------------
  hex2rgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
    return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; },
  rgba(h,a){ const [r,g,b]=U.hex2rgb(h); return `rgba(${r},${g},${b},${a})`; },
  shade(h,f){ const [r,g,b]=U.hex2rgb(h); const m=f<0?0:255, t=Math.abs(f);
    return `rgb(${Math.round(U.lerp(r,m,t))},${Math.round(U.lerp(g,m,t))},${Math.round(U.lerp(b,m,t))})`; },
  mix(h1,h2,t){ const a=U.hex2rgb(h1),b=U.hex2rgb(h2);
    return `rgb(${Math.round(U.lerp(a[0],b[0],t))},${Math.round(U.lerp(a[1],b[1],t))},${Math.round(U.lerp(a[2],b[2],t))})`; },
  // tiny SVG-ish path parser: "M x,y L x,y Q cx,cy x,y C .. Z" (normalized coords)
  parsePath(str){
    const out=[]; const tk=str.match(/[MLQCZ]|-?[\d.]+/gi)||[]; let i=0;
    const num=()=>parseFloat(tk[i++]);
    while(i<tk.length){ const c=tk[i++];
      if(c==='M'||c==='m') out.push(['M',num(),num()]);
      else if(c==='L'||c==='l') out.push(['L',num(),num()]);
      else if(c==='Q'||c==='q') out.push(['Q',num(),num(),num(),num()]);
      else if(c==='C'||c==='c') out.push(['C',num(),num(),num(),num(),num(),num()]);
      else if(c==='Z'||c==='z') out.push(['Z']);
      else i--,i++; }
    return out;
  },
  tracePath(ctx,cmds,sx,sy,ox,oy){
    ctx.beginPath();
    for(const c of cmds){
      if(c[0]==='M') ctx.moveTo(ox+c[1]*sx, oy+c[2]*sy);
      else if(c[0]==='L') ctx.lineTo(ox+c[1]*sx, oy+c[2]*sy);
      else if(c[0]==='Q') ctx.quadraticCurveTo(ox+c[1]*sx,oy+c[2]*sy,ox+c[3]*sx,oy+c[4]*sy);
      else if(c[0]==='C') ctx.bezierCurveTo(ox+c[1]*sx,oy+c[2]*sy,ox+c[3]*sx,oy+c[4]*sy,ox+c[5]*sx,oy+c[6]*sy);
      else if(c[0]==='Z') ctx.closePath();
    }
  },
  el(tag, attrs, ...kids){
    const e=document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==='style') e.style.cssText=attrs[k];
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else if(k==='html') e.innerHTML=attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
    return e;
  },
  dl(name, text, type='application/json'){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  },
  fmtMs:s=>`${s<0?'−':''}${Math.round(Math.abs(s)*1000)}ms`,
  fmtT(s){ s=Math.max(0,s); const m=Math.floor(s/60); return `${m}:${String(Math.floor(s%60)).padStart(2,'0')}`; },
};
function toast(msg, ms=2600){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), ms);
}

/* ═══ MODULE: Settings — persisted to localStorage (settings/calibration only) ═══ */
const Settings = {
  KEY:'marionette.settings.v1',
  d:null,
  defaults(){ return {
    // ASDFG maps straight across the crossbar, left to right
    bindings:{ KeyA:'handL', KeyS:'legL', KeyD:'head', KeyF:'legR', KeyG:'handR',
               ArrowLeft:'tiltL', ArrowRight:'tiltR', KeyJ:'tiltL', KeyK:'tiltR' },
    audioOffset:0, inputOffset:0, calibrated:false,
    judgeScale:1, volume:0.85, musicVol:0.9, sfxVol:0.9,
    reduceFlash:false, noScare:false, visMetronome:false, showLatency:true,
  };},
  load(){ try{ this.d=Object.assign(this.defaults(), JSON.parse(localStorage.getItem(this.KEY)||'{}')); }
          catch(e){ this.d=this.defaults(); }
    // migrate saves that still carry the untouched pre-1.1 default (A=head)
    const oldDef={KeyA:'head',KeyS:'handL',KeyD:'handR',KeyF:'legL',KeyG:'legR',
      ArrowLeft:'tiltL',ArrowRight:'tiltR',KeyJ:'tiltL',KeyK:'tiltR'};
    const canon=b=>Object.entries(b||{}).sort((x,y)=>x[0]<y[0]?-1:1).map(e=>e.join(':')).join(',');
    if(canon(this.d.bindings)===canon(oldDef)) this.d.bindings=this.defaults().bindings;
    return this.d; },
  save(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.d)); }catch(e){} },
  actionOf(code){ return this.d.bindings[code]||null; },
  keyFor(action){ for(const c in this.d.bindings) if(this.d.bindings[c]===action) return c; return null; },
  keyLabel(action){ const c=this.keyFor(action); return c? c.replace('Key','').replace('Arrow','') : '—'; },
};

/* ═══ MODULE: Story — campaign progress, persisted ═══ */
const Story = {
  KEY:'marionette.story.v1',
  d:null,
  load(){ try{ this.d=Object.assign({acts:{}, unlocked:1, baseUnease:0.08, ending:null},
            JSON.parse(localStorage.getItem(this.KEY)||'{}')); }
          catch(e){ this.d={acts:{},unlocked:1,baseUnease:0.08,ending:null}; } return this.d; },
  save(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.d)); }catch(e){} },
  record(actId, res){
    const prev=this.d.acts[actId];
    if(!prev || res.score>prev.score) this.d.acts[actId]=res;
    const n=parseInt((actId.match(/\d+/)||[0])[0],10);
    if(n>=1 && n<5 && res.grade!=='D') this.d.unlocked=Math.max(this.d.unlocked, n+1);
    // the audience remembers: your failures seed the next act's unease
    this.d.baseUnease = U.clamp(0.06 + res.peakUnease*0.3 + (1-res.acc)*0.22, 0.05, 0.6);
    if(n===5) this.d.ending = this.path();
    this.save();
  },
  /* Which storyline is this run on? The director decides from your grades
     and how restless the house has become. Surtitle scripts, the finale's
     staging, and the ending all follow the path. */
  path(){
    const recs=Object.keys(this.d.acts).filter(k=>/^act\d$/.test(k)).map(k=>this.d.acts[k]);
    if(!recs.length) return 'first';
    const pts={S:4,A:3,B:2,C:1,D:0};
    const avg=recs.reduce((s,r)=>s+(pts[r.grade]??0),0)/recs.length;
    const un=this.d.baseUnease??0.08;
    if(avg>=3 && un<0.32) return 'gentle';
    if(avg<=1.4 || un>0.45) return 'understudy';
    return 'long';
  },
  reset(){ this.d={acts:{},unlocked:1,baseUnease:0.08,ending:null}; this.save(); },
};

/* ═══ MODULE: Clock — single AudioContext-based timeline ═══
   Song position is ALWAYS ctx.currentTime - t0 (+ song offset). Never rAF
   deltas, never audio.currentTime. Input timestamps (event.timeStamp) are
   mapped onto this clock through a smoothed performance.now()↔ctx offset. */
const Clock = {
  ctx:null, master:null, musicG:null, sfxG:null, filt:null, comp:null,
  buffer:null, src:null,
  playing:false, t0:0, songAt0:0, pausedAt:0, dur:0,
  perfOff:null, _ended:false,
  ensure(){
    if(!this.ctx){
      const AC = window.AudioContext||window.webkitAudioContext;
      this.ctx = new AC();
      this.master=this.ctx.createGain();
      this.filt=this.ctx.createBiquadFilter(); this.filt.type='lowpass'; this.filt.frequency.value=19000;
      this.comp=this.ctx.createDynamicsCompressor();
      this.comp.threshold.value=-14; this.comp.knee.value=22; this.comp.ratio.value=5;
      this.musicG=this.ctx.createGain(); this.sfxG=this.ctx.createGain();
      this.musicG.connect(this.master); this.sfxG.connect(this.master);
      this.master.connect(this.filt); this.filt.connect(this.comp); this.comp.connect(this.ctx.destination);
      this.applyVolumes();
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
    return this.ctx;
  },
  applyVolumes(){
    if(!this.ctx) return;
    this.master.gain.value = Settings.d.volume**1.6;
    this.musicG.gain.value = Settings.d.musicVol;
    this.sfxG.gain.value   = Settings.d.sfxVol;
  },
  setBuffer(buf){ this.stop(); this.buffer=buf; this.dur=buf?buf.duration:0; },
  /* play the buffer such that song position `from` occurs `leadIn` s from now.
     `from` may be negative only via leadIn (pre-roll silence). */
  play(from=0, leadIn=0.12){
    this.ensure(); this.stopSrc();
    const when=this.ctx.currentTime + Math.max(0.05, leadIn);
    if(this.buffer){
      this.src=this.ctx.createBufferSource(); this.src.buffer=this.buffer;
      this.src.connect(this.musicG);
      const off=Math.max(0,from);
      this.src.start(when + Math.max(0,-from), off);
      this._ended=false; this.src.onended=()=>{ this._ended=true; };
    }
    this.t0=when; this.songAt0=from; this.playing=true;
  },
  stopSrc(){ if(this.src){ try{this.src.onended=null; this.src.stop();}catch(e){} this.src=null; } },
  pause(){ if(!this.playing) return; this.pausedAt=this.rawPos(); this.stopSrc(); this.playing=false; },
  resume(){ if(this.playing) return; this.play(this.pausedAt, 0.1); },
  stop(){ this.stopSrc(); this.playing=false; this.pausedAt=0; },
  seek(t){ const wasPlaying = this.playing; if(wasPlaying) this.play(t,0.06); else this.pausedAt=t; },
  rawPos(){ return this.playing ? (this.ctx.currentTime - this.t0) + this.songAt0 : this.pausedAt; },
  ended(){ return this._ended && this.playing && this.rawPos()>this.dur-0.05; },
  /* gameplay time: what the player is hearing right now, chart-aligned */
  t(){ return this.rawPos() - Settings.d.audioOffset; },
  updatePerfOff(){
    if(!this.ctx) return;
    const s=this.ctx.currentTime - performance.now()/1000;
    this.perfOff = this.perfOff==null? s : this.perfOff*0.92 + s*0.08;
  },
  /* map a DOM event.timeStamp (ms, performance-clock) to gameplay time */
  stampToT(stampMs){
    if(this.perfOff==null || !this.ctx) return this.t();
    const ctxTime = stampMs/1000 + this.perfOff;
    const pos=this.playing ? (ctxTime - this.t0) + this.songAt0 : this.pausedAt;
    return pos - Settings.d.audioOffset - Settings.d.inputOffset;
  },
  stampToCtx(stampMs){ return this.perfOff==null? this.ctx.currentTime : stampMs/1000+this.perfOff; },
};

/* ═══ SFX — small synthesized cues on the live context ═══
   The travel pulse and the note cue must be audibly distinct: the SEND is a
   dry high tick (your hand), the ARRIVAL is a woody knock (the puppet). */
const SFX = {
  play(build, when){
    if(!Clock.ctx) return;
    const ctx=Clock.ctx, t=when||ctx.currentTime;
    build(ctx, t, Clock.sfxG);
  },
  osc(ctx,dest,t,{type='sine',f=440,f1,dur=0.2,g=0.2,a=0.004,curve='exp'}){
    const o=ctx.createOscillator(), gn=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.linearRampToValueAtTime(g, t+a);
    if(curve==='exp') gn.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    else gn.gain.linearRampToValueAtTime(0.0001, t+dur);
    o.connect(gn); gn.connect(dest); o.start(t); o.stop(t+dur+0.05);
  },
  noise(ctx,dest,t,{dur=0.08,g=0.2,bp=1800,q=1.4,a=0.002}){
    const len=Math.max(1,Math.floor(ctx.sampleRate*dur)), buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const s=ctx.createBufferSource(); s.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=bp; f.Q.value=q;
    const gn=ctx.createGain(); gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(g,t+a);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(gn); gn.connect(dest); s.start(t);
  },
  send(lane){ this.play((c,t,d)=>{ this.osc(c,d,t,{type:'triangle',f:1500+lane*120,f1:900,dur:0.05,g:0.10});
    this.noise(c,d,t,{dur:0.03,g:0.05,bp:4200}); }); },
  arrive(grade,lane){
    this.play((c,t,d)=>{
      if(grade==='perfect'){ this.noise(c,d,t,{dur:0.05,g:0.16,bp:900,q:1}); this.osc(c,d,t,{f:520+lane*36,f1:430,dur:0.16,g:0.14,type:'sine'}); this.osc(c,d,t,{f:1560+lane*60,dur:0.3,g:0.05,type:'sine'}); }
      else if(grade==='good'){ this.noise(c,d,t,{dur:0.05,g:0.13,bp:700}); this.osc(c,d,t,{f:420+lane*30,f1:360,dur:0.13,g:0.11}); }
      else if(grade==='early'||grade==='late'){ this.noise(c,d,t,{dur:0.06,g:0.10,bp:420,q:0.8}); this.osc(c,d,t,{f:250,f1:210,dur:0.14,g:0.09,type:'triangle'}); }
      else { this.slackTwang(lane); }
    });
  },
  slackTwang(lane){ this.play((c,t,d)=>{ this.osc(c,d,t,{type:'sawtooth',f:180+lane*14,f1:60,dur:0.5,g:0.11});
    this.noise(c,d,t,{dur:0.2,g:0.07,bp:300,q:0.7}); }); },
  creakTwist(){ this.play((c,t,d)=>{ for(let i=0;i<4;i++)
      this.osc(c,d,t+i*0.055,{type:'sawtooth',f:120-i*14,f1:70,dur:0.09,g:0.075});
    this.noise(c,d,t,{dur:0.3,g:0.05,bp:800,q:0.4}); }); },
  chime(n=0){ this.play((c,t,d)=>{ const f=[660,784,880,1046][n%4];
    this.osc(c,d,t,{f,dur:0.5,g:0.09}); this.osc(c,d,t,{f:f*2.01,dur:0.3,g:0.03}); }); },
  untangled(){ this.play((c,t,d)=>{ [523,659,784,1046].forEach((f,i)=>
    this.osc(c,d,t+i*0.06,{f,dur:0.5,g:0.08})); }); },
  shiver(){ this.play((c,t,d)=>{ this.osc(c,d,t,{type:'sine',f:2200,f1:1800,dur:0.25,g:0.028});
    this.noise(c,d,t,{dur:0.25,g:0.02,bp:3000,q:0.5}); }); },
  ghostPluck(lane){ this.play((c,t,d)=>{ this.osc(c,d,t,{type:'sine',f:880+lane*70,f1:840+lane*70,dur:0.22,g:0.075});
    this.osc(c,d,t,{type:'sine',f:(880+lane*70)*2.7,dur:0.1,g:0.02}); }); },
  resistBreak(){ this.play((c,t,d)=>{ this.osc(c,d,t,{type:'sawtooth',f:90,f1:45,dur:0.5,g:0.16});
    this.noise(c,d,t,{dur:0.3,g:0.12,bp:250,q:0.6}); }); },
  uiTick(){ this.play((c,t,d)=>this.noise(c,d,t,{dur:0.03,g:0.06,bp:2600})); },
  calTick(atCtx,strong){ if(!Clock.ctx)return; const c=Clock.ctx;
    this.osc(c,Clock.sfxG,atCtx,{f:strong?1568:1046,dur:0.06,g:0.3,type:'square'}); },
  metro(strong){ this.play((c,t,d)=>this.noise(c,d,t,{dur:0.03,g:strong?0.12:0.07,bp:strong?2200:1600})); },
  /* the sting: permitted ONLY for chart `scare` events. */
  sting(kind){
    if(Settings.d.noScare){ this.play((c,t,d)=>{ this.osc(c,d,t,{f:392,dur:1.2,g:0.07}); this.osc(c,d,t,{f:494,dur:1.2,g:0.05}); }); return; }
    this.play((c,t,d)=>{
      [466.16,493.88,523.25,932.33].forEach(f=> this.osc(c,d,t,{f,dur:2.2,g:0.11,type:'sine',curve:'exp'}));
      this.osc(c,d,t,{type:'sine',f:60,f1:32,dur:2.4,g:0.30});
      this.noise(c,d,t,{dur:0.5,g:0.14,bp:500,q:0.4});
      if(kind==='reveal') [1244.5,1318.5].forEach((f,i)=>this.osc(c,d,t+0.3+i*0.2,{f,dur:1.6,g:0.05}));
    });
  },
};

/* ═══ MODULE: Synth — offline rendering of bundled scores ═══
   Bundled charts carry a `synth` block (score) instead of an audio file, so
   the campaign ships with zero external assets. Rendered once per load via
   OfflineAudioContext into the same AudioBuffer path user audio takes. */
const Synth = {
  cache:new Map(),
  midi2f: m=>440*Math.pow(2,(m-69)/12),
  async render(spec){
    const key=JSON.stringify(spec).length+':'+(spec.id||JSON.stringify(spec).slice(0,80));
    if(this.cache.has(key)) return this.cache.get(key);
    const sr=44100, dur=spec.len+(spec.tail??2.5);
    const ctx=new OfflineAudioContext(2, Math.ceil(sr*dur), sr);
    const out=ctx.createGain(); out.gain.value=spec.gain??0.9;
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4;
    out.connect(comp); comp.connect(ctx.destination);
    // shared space: feedback delay + lowpass, a small dark hall
    const send=ctx.createGain(); send.gain.value=spec.space??0.33;
    const dl=ctx.createDelay(1.5); dl.delayTime.value=spec.echo??0.27;
    const fb=ctx.createGain(); fb.gain.value=0.42;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400;
    send.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(out);
    for(const tr of spec.tracks){
      const inst=this.inst[tr.inst]||this.inst.musicbox;
      const vol=tr.vol??1;
      for(const n of tr.notes){
        const [t,midi,d,v]=n;
        if(t>spec.len) continue;
        inst(ctx, out, send, t+0.05, this.midi2f(midi), d??0.5, (v??0.8)*vol);
      }
    }
    const buf=await ctx.startRendering();
    this.cache.set(key,buf);
    return buf;
  },
  inst:{
    musicbox(ctx,out,send,t,f,dur,v){
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.5*v,t+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(0.5,dur*1.4));
      const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=f;
      const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=f*3.98;
      const g2=ctx.createGain(); g2.gain.setValueAtTime(0.14*v,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
      o1.connect(g); o2.connect(g2); g2.connect(g);
      g.connect(out); const s=ctx.createGain(); s.gain.value=0.8; g.connect(s); s.connect(send);
      o1.start(t); o1.stop(t+dur*1.5+0.6); o2.start(t); o2.stop(t+0.3);
    },
    pluck(ctx,out,send,t,f,dur,v){
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.42*v,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(0.35,dur));
      const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f;
      const fl=ctx.createBiquadFilter(); fl.type='lowpass';
      fl.frequency.setValueAtTime(f*6,t); fl.frequency.exponentialRampToValueAtTime(f*1.5,t+0.3);
      o.connect(fl); fl.connect(g); g.connect(out); g.connect(send);
      o.start(t); o.stop(t+dur+0.5);
    },
    piano(ctx,out,send,t,f,dur,v){ // dull parlor piano
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.4*v,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(0.8,dur*1.2));
      [1,2,2.99].forEach((h,i)=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*h*(1+(i?0.0007:0));
        const hg=ctx.createGain(); hg.gain.value=[1,0.35,0.12][i]; o.connect(hg); hg.connect(g); o.start(t); o.stop(t+dur*1.3+0.8); });
      g.connect(out); g.connect(send);
    },
    drone(ctx,out,send,t,f,dur,v){
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.16*v,t+dur*0.25);
      g.gain.setValueAtTime(0.16*v,t+dur*0.7); g.gain.linearRampToValueAtTime(0.0001,t+dur);
      [-6,0,7].forEach(c=>{ const o=ctx.createOscillator(); o.type='sawtooth';
        o.frequency.value=f*Math.pow(2,c/1200); o.detune.value=c;
        const fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=f*3.2; fl.Q.value=0.6;
        o.connect(fl); fl.connect(g); o.start(t); o.stop(t+dur+0.1); });
      g.connect(out);
    },
    bass(ctx,out,send,t,f,dur,v){
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.5*v,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(0.4,dur));
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const o2=ctx.createOscillator(); o2.type='triangle'; o2.frequency.value=f*2;
      const g2=ctx.createGain(); g2.gain.value=0.12;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(out);
      o.start(t); o.stop(t+dur+0.4); o2.start(t); o2.stop(t+dur+0.4);
    },
    bell(ctx,out,send,t,f,dur,v){
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.3*v,t+0.005);
      g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(1.2,dur*2));
      [1,2.76,5.4].forEach((h,i)=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*h;
        const hg=ctx.createGain(); hg.gain.value=[1,0.28,0.09][i]; o.connect(hg); hg.connect(g);
        o.start(t); o.stop(t+dur*2+1.3); });
      g.connect(out); g.connect(send);
    },
    tick(ctx,out,send,t,f,dur,v){
      const len=Math.floor(ctx.sampleRate*0.05), buf=ctx.createBuffer(1,len,ctx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len)**2;
      const s=ctx.createBufferSource(); s.buffer=buf;
      const fl=ctx.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=f*4; fl.Q.value=1.5;
      const g=ctx.createGain(); g.gain.value=0.5*v;
      s.connect(fl); fl.connect(g); g.connect(out); s.start(t);
    },
    heart(ctx,out,send,t,f,dur,v){
      [0,0.16].forEach((o,i)=>{ const g=ctx.createGain();
        g.gain.setValueAtTime(0.0001,t+o); g.gain.linearRampToValueAtTime((i?0.3:0.5)*v,t+o+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.22);
        const os=ctx.createOscillator(); os.type='sine';
        os.frequency.setValueAtTime(f,t+o); os.frequency.exponentialRampToValueAtTime(f*0.55,t+o+0.2);
        os.connect(g); g.connect(out); os.start(t+o); os.stop(t+o+0.3); });
    },
    creak(ctx,out,send,t,f,dur,v){
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.12*v,t+dur*0.3);
      g.gain.linearRampToValueAtTime(0.0001,t+dur);
      const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(f,t);
      o.frequency.linearRampToValueAtTime(f*0.7,t+dur);
      const am=ctx.createOscillator(); am.frequency.value=11+Math.min(8,f%9); const amg=ctx.createGain(); amg.gain.value=0.5;
      am.connect(amg); amg.connect(g.gain);
      const fl=ctx.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=f*2.4; fl.Q.value=2;
      o.connect(fl); fl.connect(g); g.connect(out); g.connect(send);
      o.start(t); o.stop(t+dur+0.1); am.start(t); am.stop(t+dur+0.1);
    },
  },
};

/* ═══ MODULE: Chart — format "marionette.chart/1" ═══
   The editor operates on the RAW chart object and re-normalizes after each
   edit; export serializes the raw object, so unknown fields and authoring
   quirks survive a round trip losslessly. Runtime reads only the normalized
   view and never mutates the raw. */
const Chart = {
  FORMAT:'marionette.chart/1',
  blank(){
    return {
      format:this.FORMAT,
      meta:{ title:'untitled', artist:'', mapper:'', audio:'', difficulty:1, previewTime:0 },
      timing:{ offset:0, bpms:[{time:0,bpm:120}], beatsPerBar:4 },
      stage:{ palette:['#10131d','#232a3d','#d9a441','#e8ddc4','#5d6b85','#2c2620','#8a6a42','#c9b28a','#3d4a5c','#1a1d29','#815537','#0b0d14'],
        flats:[{id:'backdrop',parallax:0,path:'M 0,0 L 1,0 L 1,1 L 0,1 Z',fill:1}],
        footlights:[{x:0.25,intensity:1},{x:0.5,intensity:1},{x:0.75,intensity:1}],
        puppetDepth:0.35 },
      strings:{ length:420, pulseSpeed:900 },
      notes:[], events:[],
    };
  },
  validate(raw){
    const errs=[];
    if(!raw || typeof raw!=='object') return ['chart is not an object'];
    if(raw.format!==this.FORMAT) errs.push(`format must be "${this.FORMAT}"`);
    if(!raw.timing || !Array.isArray(raw.timing.bpms) || !raw.timing.bpms.length)
      errs.push('timing.bpms required (non-empty array of {time,bpm})');
    if(!Array.isArray(raw.notes)) errs.push('notes must be an array');
    const okStr=new Set(CFG.laneNames);
    (raw.notes||[]).forEach((n,i)=>{
      if(typeof n.t!=='number') errs.push(`note[${i}] missing t`);
      const ty=n.type||'pull';
      if(!['pull','hold','tilt','resist','chord'].includes(ty)) errs.push(`note[${i}] bad type "${ty}"`);
      if(ty==='chord'){ if(!Array.isArray(n.strings)||n.strings.length<2) errs.push(`note[${i}] chord needs strings[]`);
        else n.strings.forEach(s=>{ if(!okStr.has(s)) errs.push(`note[${i}] bad string "${s}"`); }); }
      else if(ty!=='tilt' && !okStr.has(n.string)) errs.push(`note[${i}] bad string "${n.string}"`);
      if((ty==='hold'||ty==='tilt') && !(n.duration>0)) errs.push(`note[${i}] ${ty} needs duration>0`);
    });
    (raw.events||[]).forEach((e,i)=>{ if(typeof e.t!=='number') errs.push(`event[${i}] missing t`); });
    return errs;
  },
  normalize(raw){
    const c={ raw, meta:Object.assign({title:'untitled',artist:'',mapper:'',audio:'',difficulty:1,previewTime:0}, raw.meta||{}) };
    c.timing={ offset:(raw.timing&&raw.timing.offset)||0,
      bpms:((raw.timing&&raw.timing.bpms)||[{time:0,bpm:120}]).slice().sort((a,b)=>a.time-b.time),
      beatsPerBar:(raw.timing&&raw.timing.beatsPerBar)||4 };
    c.stage=Object.assign({palette:this.blank().stage.palette, flats:[], footlights:[{x:.5,intensity:1}], puppetDepth:0.35}, raw.stage||{});
    c.strings=Object.assign({length:420, pulseSpeed:900}, raw.strings||{});
    c.synth=raw.synth||null;
    // ---- notes: expand chords, sort, index
    let id=0; const notes=[];
    for(const n of (raw.notes||[])){
      const ty=n.type||'pull';
      if(ty==='chord'){
        const cid='c'+(id);
        for(const s of (n.strings||[])) notes.push({id:id++, t:n.t, type:'pull', lane:CFG.laneOf[s], chord:cid, raw:n, state:'pending', claimed:false});
      } else if(ty==='tilt'){
        notes.push({id:id++, t:n.t, type:'tilt', dur:n.duration||1, curve:n.curve||[[0,0],[1,0]], raw:n, state:'pending'});
      } else {
        notes.push({id:id++, t:n.t, type:ty, lane:CFG.laneOf[n.string], dur:n.duration||0,
          window:n.window||0.25, cross:n.cross, raw:n, state:'pending', claimed:false});
      }
    }
    notes.sort((a,b)=>a.t-b.t || (a.lane??9)-(b.lane??9));
    c.notes=notes;
    c.laneNotes=[[],[],[],[],[]];
    c.tiltNotes=[];
    for(const n of notes){ if(n.type==='tilt') c.tiltNotes.push(n); else c.laneNotes[n.lane].push(n); }
    c.events=((raw.events||[]).slice()).sort((a,b)=>a.t-b.t);
    const lastN=notes.length?notes[notes.length-1]:null;
    const lastNt=lastN? lastN.t+(lastN.dur||0) : 0;
    const lastEt=c.events.length? c.events[c.events.length-1].t : 0;
    c.endT=Math.max(lastNt, lastEt)+3;
    c.judgeCount=notes.filter(n=>n.type!=='tilt').length + c.tiltNotes.length;
    return c;
  },
  /* seconds → musical beat (bpms are time-anchored, per format) */
  beatOfTime(c,t){
    const b=c.timing.bpms; let beat=0, i=0;
    for(;i<b.length;i++){
      const seg=b[i], next=b[i+1];
      const end=next? Math.min(next.time,t) : t;
      if(t<=seg.time) break;
      if(end>seg.time) beat+=(end-seg.time)*seg.bpm/60;
      if(!next || t<=next.time) break;
    }
    if(t<b[0].time) beat=(t-b[0].time)*b[0].bpm/60;
    return beat;
  },
  timeOfBeat(c,beat){
    const b=c.timing.bpms; let acc=0;
    for(let i=0;i<b.length;i++){
      const seg=b[i], next=b[i+1];
      const segBeats=next? (next.time-seg.time)*seg.bpm/60 : Infinity;
      if(beat<=acc+segBeats || !next) return seg.time + (beat-acc)*60/seg.bpm;
      acc+=segBeats;
    }
    return 0;
  },
  bpmAt(c,t){ const b=c.timing.bpms; let r=b[0].bpm; for(const s of b){ if(t>=s.time) r=s.bpm; } return r; },
  snap(c,t,div){ // snap a time to the nearest 1/div beat
    const beat=this.beatOfTime(c,t);
    const q=Math.round(beat*div)/div;
    return this.timeOfBeat(c,q);
  },
  exportStr(raw){ return JSON.stringify(raw, null, 1); },
  async fromURL(url){
    const res=await fetch(url);
    if(!res.ok) throw new Error(`fetch ${res.status}`);
    const raw=await res.json();
    const errs=this.validate(raw);
    if(errs.length) throw new Error('invalid chart: '+errs.slice(0,3).join('; '));
    raw.__srcURL=url;
    return raw;
  },
  fromText(text){
    const raw=JSON.parse(text);
    const errs=this.validate(raw);
    if(errs.length) throw new Error('invalid chart: '+errs.slice(0,3).join('; '));
    return raw;
  },
  /* Resolve a chart's audio to an AudioBuffer. Precedence:
     attached file buffer > synth block > audio URL. */
  async resolveAudio(raw, statusCb){
    Clock.ensure();
    if(raw.__audioBuffer) return raw.__audioBuffer;
    if(raw.synth){ statusCb&&statusCb('rendering score…');
      const buf=await Synth.render(raw.synth); raw.__audioBuffer=buf; return buf; }
    const a=(raw.meta&&raw.meta.audio)||'';
    if(a && !a.startsWith('synth:')){
      const url=raw.__srcURL? new URL(a, raw.__srcURL).href : a;
      statusCb&&statusCb('fetching audio…');
      const res=await fetch(url);
      if(!res.ok) throw new Error('audio fetch failed '+res.status);
      const ab=await res.arrayBuffer();
      statusCb&&statusCb('decoding audio…');
      const buf=await Clock.ctx.decodeAudioData(ab);
      raw.__audioBuffer=buf; return buf;
    }
    // no audio: silent bed long enough for the chart (visual metronome still works)
    const norm=this.normalize(raw);
    const dur=Math.max(10, norm.endT+2);
    const buf=Clock.ctx.createBuffer(2, Math.ceil(44100*dur), 44100);
    raw.__audioBuffer=buf; return buf;
  },
};

/* ═══ MODULE: Scoring — accuracy, combo, slack/idle/twist tallies ═══
   No health bar, no fail state: these numbers exist to grade the show and
   feed the story. */
const Scoring = {
  reset(S,total){
    S.score={ counts:{perfect:0,good:0,early:0,late:0,miss:0}, judged:0, total,
      combo:0, maxCombo:0, slackFrames:0, idleFrames:0, ticks:0, peakTwists:0,
      peakUnease:0, bestStreak:0 };
  },
  judge(S,kind){
    const sc=S.score; sc.counts[kind]++; sc.judged++;
    if(kind==='miss'){ sc.combo=0; }
    else { sc.combo++; sc.maxCombo=Math.max(sc.maxCombo,sc.combo); }
  },
  tick(S,{slackCount,idle,twists,unease}){
    const sc=S.score; sc.ticks++;
    sc.slackFrames+=slackCount>0?1:0;
    if(idle) sc.idleFrames++;
    sc.peakTwists=Math.max(sc.peakTwists,twists);
    sc.peakUnease=Math.max(sc.peakUnease,unease);
  },
  acc(S){
    const c=S.score.counts, n=S.score.judged||1;
    return (c.perfect + c.good*0.65 + (c.early+c.late)*0.3)/n;
  },
  finalize(S){
    const sc=S.score, c=sc.counts;
    const n=Math.max(1,sc.total);
    const acc=(c.perfect + c.good*0.65 + (c.early+c.late)*0.3)/n;
    const comboR=sc.maxCombo/n;
    const slackR=U.clamp(sc.slackFrames/Math.max(1,sc.ticks)*2.2,0,1);
    const twistR=U.clamp(sc.peakTwists/CFG.maxTwists,0,1);
    const idleR=U.clamp(sc.idleFrames/Math.max(1,sc.ticks)*3,0,1);
    const score=100*(acc*0.60 + comboR*0.15 + (1-slackR)*0.10 + (1-twistR)*0.075 + (1-idleR)*0.075);
    const grade= score>=93?'S': score>=85?'A': score>=72?'B': score>=55?'C':'D';
    return { grade, score:Math.round(score*10)/10, acc, counts:{...c}, maxCombo:sc.maxCombo,
      slackFrames:sc.slackFrames, idleFrames:sc.idleFrames, ticks:sc.ticks,
      peakTwists:sc.peakTwists, peakUnease:sc.peakUnease };
  },
};

/* ═══ MODULE: Input — keyboard + pointer, timestamped at the event ═══
   Latency discipline: every judgment uses event.timeStamp mapped through
   Clock.stampToT, never the frame the event happens to be processed in. */
const Input = {
  down:{}, tiltKey:0, dragTilt:null, pointers:new Map(), touchHeld:new Set(),
  lastInputSongT:-99, remapCb:null,
  init(){
    addEventListener('keydown', e=>{
      if(this.remapCb){ e.preventDefault(); const cb=this.remapCb; this.remapCb=null; cb(e.code); return; }
      if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      const act=Settings.actionOf(e.code);
      if(act) e.preventDefault();
      if(e.repeat) return;
      if(act){ this.down[act]=true;
        if(CFG.laneOf[act]!=null) Game.onTrigger(CFG.laneOf[act], e.timeStamp, 'key');
      }
      Game.onKey(e);
    });
    addEventListener('keyup', e=>{
      const act=Settings.actionOf(e.code);
      if(act){ this.down[act]=false;
        if(CFG.laneOf[act]!=null) Game.onRelease(CFG.laneOf[act], e.timeStamp); }
    });
    const cv=document.getElementById('cv');
    cv.addEventListener('pointerdown', e=>{
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}
      if(Game.mode==='calib'){ Game.onTrigger(-1, e.timeStamp, 'tap'); return; }
      if(Game.mode!=='play' && Game.mode!=='editor-play') { Game.onStageTap(e); return; }
      const S=Game.S; if(!S||!S.anchors) return;
      // five tap zones, hit-tested against the actual rendered anchor positions
      let best=-1, bd=1e9;
      S.anchors.forEach((a,i)=>{ const d=U.dist(e.clientX,e.clientY,a.x,a.y); if(d<bd){bd=d;best=i;} });
      const coarse=e.pointerType==='touch'||CFG.isTouch;
      const hitR=coarse? Math.max(46, L.W*0.055) : Math.max(34, L.W*0.035);
      if(bd<hitR){
        this.pointers.set(e.pointerId,{kind:'anchor',anchor:best});
        this.touchHeld.add(best);
        Game.onTrigger(best, e.timeStamp, 'tap');
      } else if(Math.abs(e.clientY-L.crossY)<L.H*(coarse?0.13:0.09)){
        this.pointers.set(e.pointerId,{kind:'tilt',x0:e.clientX,base:this.dragTilt??0});
      }
    });
    cv.addEventListener('pointermove', e=>{
      const p=this.pointers.get(e.pointerId);
      if(p&&p.kind==='tilt'){ this.dragTilt=U.clamp(p.base+(e.clientX-p.x0)/(L.W*0.14),-1,1); }
    });
    const up=e=>{
      const p=this.pointers.get(e.pointerId);
      if(p){ if(p.kind==='anchor'){ this.touchHeld.delete(p.anchor); Game.onRelease(p.anchor, e.timeStamp); }
        if(p.kind==='tilt') this.dragTilt=null;
        this.pointers.delete(e.pointerId); }
    };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  },
  /* analog tilt −1..1 : held keys ramp, pointer drag overrides */
  update(dt){
    const k=(this.down.tiltR?1:0)-(this.down.tiltL?1:0);
    this.tiltKey = k!==0 ? U.clamp(this.tiltKey + k*dt*4.2, -1, 1)
                         : this.tiltKey*(1-Math.min(1,dt*7));
    if(Math.abs(this.tiltKey)<0.004&&k===0) this.tiltKey=0;
  },
  tilt(){ return this.dragTilt!=null? this.dragTilt : this.tiltKey; },
  /* a held finger on a hook counts as a held key (touch holds) */
  actionDown(a){ return !!this.down[a] || (CFG.laneOf[a]!=null && this.touchHeld.has(CFG.laneOf[a])); },
  anyLaneDown(){ return CFG.laneNames.some(n=>this.down[n]); },
};

/* ═══ MODULE: Strings — the signature mechanic ═══
   A trigger spawns a pulse at the crossbar; the limb moves only when the
   pulse ARRIVES:  arrivalTime = inputTime + stringLength/pulseSpeed.
   Judgment compares arrivalTime with note.t. Slack, twists and the
   untangle call-and-response also live here. */
const Strings = {
  reset(S){
    S.str={
      lanes:CFG.laneNames.map(()=>({slack:false,slackT:0,glow:-9,holdGlow:0})),
      pulses:[], twists:[0,0,0,0], recent:[],
      untangle:{active:false,phase:null,pair:0,seq:[],slots:[],idx:0,nextTryT:-1,cooldown:0},
      unwind:null, holds:[], lastArriveT:-9,
    };
    S.judgeFx=[]; S.cuePtr=0;
  },
  windows(){ const s=Settings.d.judgeScale;
    return {p:CFG.judge.perfect*s, g:CFG.judge.good*s, e:CFG.judge.edge*s}; },
  gradeOf(d){ const w=this.windows(), ad=Math.abs(d);
    return ad<=w.p?'perfect': ad<=w.g?'good': ad<=w.e?(d<0?'early':'late'):'miss'; },
  travel(S){ return S.strLen / S.chart.strings.pulseSpeed; },
  totalTwists(S){ return S.str.twists[0]+S.str.twists[1]+S.str.twists[2]+S.str.twists[3]; },
  mapA2L(S,a){ let cur=a; for(let p=0;p<4;p++){ if(S.str.twists[p]%2){ if(cur===p)cur=p+1; else if(cur===p+1)cur=p; } } return cur; },
  anchorForLimb(S,l){ for(let a=0;a<5;a++) if(this.mapA2L(S,a)===l) return a; return l; },

  trigger(S, anchor, tIn){
    const st=S.str, lane=st.lanes[anchor];
    lane.glow=tIn;
    Input.lastInputSongT=tIn;
    SFX.send(anchor);
    if(S.invert){ this.triggerInverted(S,anchor,tIn); return; }
    const limb=this.mapA2L(S,anchor);
    const tau=this.travel(S);
    const t1=tIn+tau;
    // untangle response intercepts anchor presses
    if(st.untangle.active && st.untangle.phase==='resp'){
      this.untangleTap(S,anchor,tIn);
      st.pulses.push({anchor,limb,t0:tIn,t1,note:null,judged:false,ghostResp:true});
      return;
    }
    // claim the nearest pending note on the LIMB this anchor currently drives
    let note=null, bd=CFG.judge.capture;
    for(const n of S.chart.laneNotes[limb]){
      if(n.state!=='pending'||n.claimed) continue;
      if(n.type==='resist') continue;
      const d=Math.abs(t1-n.t);
      if(d<bd){ bd=d; note=n; }
      if(n.t-t1>CFG.judge.capture) break;
    }
    if(note) note.claimed=true;
    // does this pulse land inside a resist window? mark it as a breaker
    let resistN=null;
    for(const n of S.chart.laneNotes[limb]){
      if(n.type==='resist'&&(n.state==='pending')&&Math.abs(t1-n.t)<=n.window) { resistN=n; break; }
      if(n.t-t1>0.6) break;
    }
    st.pulses.push({anchor,limb,t0:tIn,t1,note,resistN,judged:false});
    // ---- tangle rules ----------------------------------------------------
    const prev=st.recent.length?st.recent[st.recent.length-1]:null;
    if(prev && prev.anchor!==anchor){
      const adj=Math.abs(prev.anchor-anchor)===1;
      const dt=tIn-prev.t;
      const sameChord=note&&prev.note&&note.chord&&note.chord===prev.note.chord;
      if(adj && dt<CFG.spamWin && !sameChord){
        this.twist(S, Math.min(anchor,prev.anchor), 'spam');
      } else if(note&&prev.note&&dt<CFG.crossWin){
        const explicit=(note.cross!=null&&prev.note.cross!=null)? prev.note.cross>note.cross
                      : prev.note.t>note.t+0.02;
        if(explicit){
          if(adj) this.twist(S, Math.min(anchor,prev.anchor), 'cross');
          else S.unease=Math.min(1,S.unease+0.02);
        }
      }
    }
    st.recent.push({anchor,t:tIn,note});
    if(st.recent.length>6) st.recent.shift();
  },
  triggerInverted(S,anchor,tIn){
    // the finale: pulses come DOWN to you; you react, you don't anticipate
    let note=null, bd=CFG.judge.capture;
    for(const n of S.chart.laneNotes[anchor]){
      if(n.state!=='pending'||n.claimed) continue;
      const d=Math.abs(tIn-n.t);
      if(d<bd){ bd=d; note=n; }
      if(n.t-tIn>CFG.judge.capture) break;
    }
    const tau=this.travel(S);
    S.str.pulses.push({anchor,limb:anchor,t0:tIn,t1:tIn+tau,note:null,judged:false,echo:true});
    if(!note){ Puppet.twitch(S,anchor); return; }
    note.claimed=true; note.state='hit';
    const grade=this.gradeOf(tIn-note.t);
    this.applyJudge(S,note,anchor,grade,tIn-note.t,true);
  },
  release(S,anchor,tRel){
    for(const h of S.str.holds){ if(h.anchor===anchor&&!h.done) h.keyUpAt=tRel; }
  },
  twist(S,pair,why){
    const st=S.str;
    if(this.totalTwists(S)>=CFG.maxTwists){ S.unease=Math.min(1,S.unease+0.025); return; }
    st.twists[pair]++;
    st.twistAnim={pair,t0:S.now,dir:1};
    SFX.creakTwist();
    S.unease=Math.min(1,S.unease+0.055);
    S.fx.twistPop=S.now;
  },

  /* ---- untangle: a call-and-response performed inside the song ---- */
  scheduleUntangle(S){
    const st=S.str, c=S.chart;
    if(st.untangle.active||S.invert) return;
    if(this.totalTwists(S)===0) return;
    if(S.now<st.untangle.cooldown) return;
    const beat=Chart.beatOfTime(c,S.now), bpb=c.timing.beatsPerBar;
    const bar=Math.floor(beat/bpb)+1;
    const t0=Chart.timeOfBeat(c,bar*bpb);
    if(t0-S.now<0.35||t0>c.endT-4) return;
    let pair=0; for(let p=0;p<4;p++) if(st.twists[p]>0){ pair=p; break; }
    const half=60/Chart.bpmAt(c,t0)/2;
    const seq=[pair,pair+1,pair,pair+1];
    st.untangle={active:true,phase:'call',pair,seq,idx:0,
      slots:seq.map((a,i)=>t0+i*half), respSlots:seq.map((a,i)=>t0+(i+4)*half),
      t0, tEnd:t0+8*half, cooldown:0, cueFired:[false,false,false,false]};
  },
  untangleTap(S,anchor,tIn){
    const u=S.str.untangle;
    const slot=u.respSlots[u.idx];
    if(anchor===u.seq[u.idx] && Math.abs(tIn-slot)<=0.22){
      SFX.chime(u.idx); u.idx++;
      if(u.idx>=4) this.untangleDone(S,true);
    } else {
      u.failed=true; this.untangleDone(S,false);
    }
  },
  untangleDone(S,ok){
    const u=S.str.untangle, st=S.str;
    if(ok){ st.twists[u.pair]=Math.max(0,st.twists[u.pair]-1);
      st.unwind={pair:u.pair,t0:S.now};
      SFX.untangled(); S.unease=Math.max(0,S.unease-0.03);
    } else { S.unease=Math.min(1,S.unease+0.02); }
    st.untangle={active:false,phase:null,pair:0,seq:[],slots:[],idx:0,cooldown:S.now+ (ok?0.5:0.4)};
  },
  untangleUpdate(S){
    const u=S.str.untangle; if(!u.active) return;
    if(S.now>=u.t0 && u.phase==='call'){
      u.slots.forEach((t,i)=>{ if(!u.cueFired[i]&&S.now>=t){ u.cueFired[i]=true; SFX.ghostPluck(u.seq[i]); } });
      if(S.now>=u.respSlots[0]-0.25) u.phase='resp';
    } else if(u.phase==='resp'){
      const slot=u.respSlots[u.idx];
      if(S.now>slot+0.25) this.untangleDone(S,false);
    }
    if(S.now>u.tEnd+0.3&&u.active) this.untangleDone(S,false);
  },

  applyJudge(S,note,limb,grade,delta,invert){
    if(grade==='miss'){ Scoring.judge(S,'miss'); this.goSlack(S,limb,note); }
    else {
      Scoring.judge(S,grade);
      const lane=S.str.lanes[limb];
      if((grade==='perfect'||grade==='good')&&lane.slack){ lane.slack=false; lane.slackT=S.now; }
      S.unease=Math.max(0,S.unease-(grade==='perfect'?0.006:0.003));
    }
    const at=invert? S.anchors[limb] : Puppet.attach(S,limb);
    S.judgeFx.push({t:S.now,grade,delta,x:at.x,y:at.y,limb});
    SFX.arrive(grade,limb);
    if(!invert) Puppet.onArrive(S,limb,grade);
  },
  goSlack(S,limb,note){
    const lane=S.str.lanes[limb];
    if(!lane.slack){ lane.slack=true; lane.slackT=S.now; SFX.slackTwang(limb); }
    S.unease=Math.min(1,S.unease+0.02);
  },

  update(S,dt){
    const st=S.str, now=S.now, c=S.chart;
    // ---- pulse arrivals --------------------------------------------------
    for(const p of st.pulses){
      if(p.judged||now<p.t1) continue;
      p.judged=true; st.lastArriveT=now;
      if(p.echo||p.ghostResp){ Puppet.twitch(S,p.limb); continue; }
      if(st.untangle.active){
        if(p.note&&p.note.state==='pending'){ p.note.state='skipped'; S.score.total--; }
        Puppet.twitch(S,p.limb); continue;
      }
      if(p.resistN&&p.resistN.state!=='missed'&&p.resistN.state!=='hit'){
        p.resistN.state='missed'; Scoring.judge(S,'miss');
        SFX.resistBreak(); Puppet.stagger(S,p.limb);
        S.judgeFx.push({t:now,grade:'break',delta:0,...Puppet.attach(S,p.limb),limb:p.limb});
        S.unease=Math.min(1,S.unease+0.05);
        continue;
      }
      if(p.note){
        const d=p.t1-p.note.t;
        const grade=this.gradeOf(d);
        p.note.state=grade==='miss'?'missed':'hit'; p.grade=grade;
        if(p.note.type==='hold'&&grade!=='miss'){
          st.holds.push({note:p.note,anchor:p.anchor,limb:p.limb,startGrade:grade,
            held:0,total:0,endT:p.note.t+p.note.dur,done:false});
          const at=Puppet.attach(S,p.limb);
          S.judgeFx.push({t:now,grade,delta:d,x:at.x,y:at.y,limb:p.limb,holdStart:true});
          SFX.arrive(grade,p.limb); Puppet.onArrive(S,p.limb,grade,true);
        } else this.applyJudge(S,p.note,p.limb,grade,d,false);
      } else Puppet.twitch(S,p.limb);
    }
    st.pulses=st.pulses.filter(p=>now<p.t1+0.4);
    // ---- note sweeps: misses, resist resolutions, self-motion ------------
    const w=this.windows();
    for(let lane=0;lane<5;lane++){
      for(const n of c.laneNotes[lane]){
        if(n.state!=='pending') continue;
        if(n.t>now+0.7) break;
        if(n.type==='resist'){
          if(!n.moved&&now>=n.t){ n.moved=true; if(!st.untangle.active) Puppet.selfMove(S,lane); }
          if(now>n.t+n.window){ n.state='hit';
            if(st.untangle.active){ n.state='skipped'; S.score.total--; }
            else { Scoring.judge(S,'perfect');
              const at=Puppet.attach(S,lane);
              S.judgeFx.push({t:now,grade:'still',delta:0,x:at.x,y:at.y,limb:lane}); }
          }
        } else {
          if(now>n.t+w.e+0.005&&!n.claimed){
            if(st.untangle.active){ n.state='skipped'; S.score.total--; }
            else { n.state='missed'; Scoring.judge(S,'miss'); this.goSlack(S,lane,n);
              S.judgeFx.push({t:now,grade:'miss',delta:0,...Puppet.attach(S,lane),limb:lane}); }
          }
        }
      }
    }
    // ---- holds -----------------------------------------------------------
    for(const h of st.holds){
      if(h.done) continue;
      h.total++;
      const act=CFG.laneNames[h.anchor];
      if(Input.actionDown(act)) { h.held++; st.lanes[h.limb].holdGlow=now; }
      if(now>=h.endT){
        h.done=true;
        const frac=h.held/Math.max(1,h.total);
        const grade= frac>=CFG.holdOkFrac? h.startGrade : frac>=0.4?'good':'miss';
        if(grade==='miss'){ Scoring.judge(S,'miss'); this.goSlack(S,h.limb,h.note); }
        else { Scoring.judge(S,grade);
          const lane=st.lanes[h.limb];
          if((grade==='perfect'||grade==='good')&&lane.slack){ lane.slack=false; lane.slackT=now; } }
        const at=Puppet.attach(S,h.limb);
        S.judgeFx.push({t:now,grade,delta:0,x:at.x,y:at.y,limb:h.limb});
      }
    }
    st.holds=st.holds.filter(h=>!h.done||now<h.endT+0.5);
    // ---- tilt notes ------------------------------------------------------
    for(const n of c.tiltNotes){
      if(n.state==='hit'||n.state==='missed'||n.state==='skipped') continue;
      if(now<n.t) break;
      if(now<=n.t+n.dur){
        n.state='active';
        n.gt=(n.gt||0)+1; // total ticks
        const u=(now-n.t)/n.dur;
        const target=this.curveAt(n.curve,u);
        if(Math.abs(S.pup.lean-target)<=CFG.tiltTol) n.ok=(n.ok||0)+1;
      } else {
        const frac=(n.ok||0)/Math.max(1,n.gt||1);
        if(st.untangle.active){ n.state='skipped'; S.score.total--; }
        else{
          const grade= frac>=0.85?'perfect': frac>=0.6?'good': frac>=0.35?'late':'miss';
          n.state= grade==='miss'?'missed':'hit';
          Scoring.judge(S,grade);
          S.judgeFx.push({t:now,grade,delta:0,x:S.cross.x,y:L.crossY+40,limb:-1,tilt:true});
          if(grade!=='miss') SFX.arrive(grade,2);
        }
      }
    }
    // ---- untangle machine ------------------------------------------------
    this.scheduleUntangle(S);
    this.untangleUpdate(S);
    // ---- fx expiry -------------------------------------------------------
    S.judgeFx=S.judgeFx.filter(f=>now-f.t<1.0);
    if(st.unwind&&now-st.unwind.t0>0.5) st.unwind=null;
  },
  curveAt(curve,u){
    if(!curve||!curve.length) return 0;
    if(u<=curve[0][0]) return curve[0][1];
    for(let i=0;i<curve.length-1;i++){
      const a=curve[i],b=curve[i+1];
      if(u<=b[0]){ const t=(u-a[0])/Math.max(1e-6,b[0]-a[0]); return U.lerp(a[1],b[1],U.smooth(t)); }
    }
    return curve[curve.length-1][1];
  },
};

/* ═══ MODULE: Puppet — 5-anchor articulated marionette with limb IK ═══
   The rig responds CONTINUOUSLY to string state: pulse arrivals inject lift
   envelopes, slack strings drop limbs into dangle poses, the head string
   suspends the whole body (losing it is a collapse). Legs are strung at the
   knees like a real marionette; shins are pendulums. */
const Puppet = {
  reset(S){
    S.pup={ lean:0, leanHist:[], walk:0, slump:0,
      imp:[{t:-9,amp:0},{t:-9,amp:0},{t:-9,amp:0},{t:-9,amp:0},{t:-9,amp:0}],
      self:[{t:-9},{t:-9},{t:-9},{t:-9},{t:-9}],
      stagger:-9, face:0, bow:0,
      swayW:[{a:0,v:0},{a:0,v:0}], swayA:[{a:0,v:0},{a:0,v:0}],
      j:{}, h:100,
    };
  },
  onArrive(S,limb,grade,hold){
    const amp={perfect:1,good:0.85,early:0.6,late:0.6,miss:0.35}[grade]??0.5;
    S.pup.imp[limb]={t:S.now,amp,hold:!!hold};
  },
  twitch(S,limb){ S.pup.imp[limb]={t:S.now,amp:0.3}; },
  selfMove(S,lane){ S.pup.self[lane]={t:S.now}; },
  stagger(S){ S.pup.stagger=S.now; },
  attach(S,limb){
    const j=S.pup.j;
    return [j.wristL,j.kneeL,j.headTop,j.kneeR,j.wristR][limb]||{x:L.cx,y:L.H/2};
  },
  env(age,attack=0.06,decay=0.34){
    if(age<0) return 0;
    if(age<attack) return age/attack;
    return Math.max(0, 1-(age-attack)/decay);
  },
  ik(a,b,l1,l2,side){
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
    const m=l1+l2-2;
    if(d>m){ dx*=m/d; dy*=m/d; d=m; b={x:a.x+dx,y:a.y+dy}; }
    d=Math.max(d,1e-4);
    const k=(d*d+l1*l1-l2*l2)/(2*d);
    const h=Math.sqrt(Math.max(0,l1*l1-k*k));
    const ux=dx/d, uy=dy/d;
    return { elbow:{x:a.x+ux*k-uy*h*side, y:a.y+uy*k+ux*h*side}, wrist:b };
  },
  update(S,dt){
    const P=S.pup, st=S.str, now=S.now;
    // ---- lean: crossbar angle history sampled travel-time ago ------------
    P.leanHist.push({t:now,v:S.cross.tilt});
    while(P.leanHist.length>400) P.leanHist.shift();
    const tau=Strings.travel(S), want=now-tau;
    let lv=0;
    for(let i=P.leanHist.length-1;i>=0;i--){ if(P.leanHist[i].t<=want){ lv=P.leanHist[i].v; break; } }
    const idle=st.untangle.active;
    P.lean += ((idle?0:lv)-P.lean)*Math.min(1,dt*10);
    // ---- walk cycle from sustained tilt ----------------------------------
    if(Math.abs(P.lean)>0.18&&!idle) P.walk+=dt*(3.2+4.5*Math.abs(P.lean));
    // ---- metrics ---------------------------------------------------------
    const h = L.H*0.30*(1-0.30*S.depth) * (1-0.25*S.fx.pullback);
    P.h=h;
    const floorY=L.floorAt(S.depth);
    const cx=L.cx + P.lean*h*0.28 + Math.sin(P.walk)*h*0.02*Math.min(1,Math.abs(P.lean)*2);
    const headSlack=st.lanes[2].slack;
    P.slump += (((headSlack&&!idle)?1:0)-P.slump)*Math.min(1,dt*2.6);
    const e=lane=>{ const im=P.imp[lane]; let v=this.env(now-im.t)*im.amp;
      if(im.hold&&now-st.lanes[lane].holdGlow<0.1) v=Math.max(v,0.8);
      const sm=P.self[lane]; const sa=now-sm.t;
      if(sa>=0&&sa<0.9){ const p=sa<0.18?U.easeOut(sa/0.18):Math.max(0,1-(sa-0.35)/0.5);
        v=Math.max(v, p*0.9); }
      return v; };
    const bob=Math.abs(Math.sin(P.walk))*h*0.015*Math.min(1,Math.abs(P.lean)*2);
    // the face: driven by scare events; the bow: by the final event
    const la=now-S.fx.lookUpT;
    let faceT=0;
    if(la>0&&la<2.4) faceT= la<0.15? la/0.15 : la>1.9? Math.max(0,(2.4-la)/0.5) : 1;
    if(S.fx.pullback>0.4) faceT=Math.max(faceT,Math.min(1,(S.fx.pullback-0.4)*2.5));
    P.face+=(faceT-P.face)*Math.min(1,dt*10);
    P.bow+=((S.fx.bow?1:0)-P.bow)*Math.min(1,dt*1.8);
    const stg=this.env(now-P.stagger,0.02,0.5);
    const jit=stg? (Math.sin(now*61)*stg*h*0.02) : 0;
    // ---- spine -----------------------------------------------------------
    const headR=h*0.072;
    const lift=e(2)*h*0.045;
    const topY=floorY - h*(1-0.34*P.slump) - lift - bob + (P.bow*h*0.10);
    const headTop={x:cx+jit + P.bow*h*0.05, y:topY};
    const headC={x:headTop.x, y:headTop.y+headR};
    const neck={x:headTop.x - P.lean*h*0.02, y:headTop.y+headR*2+h*0.02};
    const chest={x:neck.x + P.slump*h*0.06 + P.bow*h*0.12, y:neck.y+h*0.13 - P.slump*h*0.02};
    const pelvis={x:chest.x - P.lean*h*0.10 - P.bow*h*0.10 + jit*0.6,
                  y:chest.y+h*0.20 - P.slump*h*0.05};
    const shW=h*0.115, hipW=h*0.075;
    const sL={x:chest.x-shW+P.lean*h*0.02,y:chest.y-h*0.075};
    const sR={x:chest.x+shW+P.lean*h*0.02,y:chest.y-h*0.075};
    const hipL={x:pelvis.x-hipW,y:pelvis.y};
    const hipR={x:pelvis.x+hipW,y:pelvis.y};
    const uA=h*0.155,fA=h*0.155, th=h*0.205, sh=h*0.20;
    // ---- arms ------------------------------------------------------------
    const arm=(side,shoulder,lane,swayer)=>{
      const slack=st.lanes[lane].slack&&!idle;
      const ev=idle?0:e(lane);
      let target;
      if(slack){
        swayer.v += (-swayer.a*7 - swayer.v*1.4)*dt + (Math.abs(P.lean)>.2?Math.sin(P.walk*1.7)*dt*3:0);
        swayer.a += swayer.v*dt*4;
        target={x:shoulder.x+side*h*0.015+Math.sin(swayer.a)*h*0.07, y:shoulder.y+(uA+fA)*0.97};
      } else {
        const hang={x:shoulder.x+side*h*0.09, y:shoulder.y+h*0.30};
        const up={x:shoulder.x+side*h*0.30, y:shoulder.y-h*0.10};
        target={x:U.lerp(hang.x,up.x,ev), y:U.lerp(hang.y,up.y,ev)};
      }
      return this.ik(shoulder,target,uA,fA,side);
    };
    const aL=arm(-1,sL,0,P.swayW[0]);
    const aR=arm(+1,sR,4,P.swayW[1]);
    // ---- legs (strung at the knees) --------------------------------------
    const leg=(side,hip,lane,phase,swayer)=>{
      const slack=st.lanes[lane].slack&&!idle;
      const ev=idle?0:e(lane);
      const wlk=(!idle&&Math.abs(P.lean)>0.18)? Math.max(0,Math.sin(P.walk+phase))*0.55*Math.min(1,Math.abs(P.lean)*1.6):0;
      const liftv=Math.max(ev,wlk);
      let knee;
      if(slack) knee={x:hip.x+side*h*0.045, y:hip.y+th*1.04};
      else knee={x:hip.x+side*h*0.02 + liftv*h*0.075*(P.lean>=0?1:-1)*(side>0?1:1) + liftv*side*h*0.02,
                 y:hip.y+th - liftv*h*0.19};
      // shin: pendulum when lifted/slack, planted when standing
      let ankle;
      const standing=!slack&&liftv<0.12;
      if(standing){ ankle={x:hip.x+side*h*0.03, y:floorY}; swayer.a*=0.8; swayer.v*=0.8;
        knee.y=Math.min(knee.y, floorY-sh*0.98);
      } else {
        swayer.v += (-swayer.a*9 - swayer.v*1.6)*dt + liftv*Math.sin(now*9)*dt*1.2;
        swayer.a += swayer.v*dt*5;
        ankle={x:knee.x+Math.sin(swayer.a+(slack?0.1*side:0.25*side))*sh*0.35, y:knee.y+sh*0.93};
        if(slack) ankle.y=Math.min(ankle.y,floorY+h*0.01); else ankle.y=Math.min(ankle.y,floorY);
      }
      return {knee,ankle};
    };
    const lL=leg(-1,hipL,1,0,P.swayA[0]);
    const lR=leg(+1,hipR,3,Math.PI,P.swayA[1]);
    P.j={ headTop, headC, headR, neck, chest, pelvis,
      sL,sR, elbowL:aL.elbow, wristL:aL.wrist, elbowR:aR.elbow, wristR:aR.wrist,
      hipL,hipR, kneeL:lL.knee, ankleL:lL.ankle, kneeR:lR.knee, ankleR:lR.ankle,
      floorY, cx, h };
  },
  /* skeleton edge list used by both body drawing and shadow projection */
  bones(S){
    const j=S.pup.j;
    return [
      [j.headC,j.neck,3.2],[j.neck,j.chest,4.4],[j.chest,j.pelvis,4.2],
      [j.sL,j.elbowL,2.6],[j.elbowL,j.wristL,2.2],
      [j.sR,j.elbowR,2.6],[j.elbowR,j.wristR,2.2],
      [j.hipL,j.kneeL,3.0],[j.kneeL,j.ankleL,2.6],
      [j.hipR,j.kneeR,3.0],[j.kneeR,j.ankleR,2.6],
    ];
  },
  draw(ctx,S,pal){
    const P=S.pup, j=P.j; if(!j.headTop) return;
    const h=j.h, k=h/100;
    const wood=pal[6]||'#8a6a42', cloth=pal[10]||'#5a3f4a', woodHi=pal[7]||'#c9b28a';
    const line=(a,b,w,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=w*k; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); };
    ctx.save();
    // far limbs first, slightly darkened
    const dark=U.shade(wood.startsWith('#')?wood:'#8a6a42',-0.25);
    line(j.sR,j.elbowR,5.5,dark); line(j.elbowR,j.wristR,4.5,dark);
    line(j.hipR,j.kneeR,6.5,dark); line(j.kneeR,j.ankleR,5.5,dark);
    // torso cloth
    ctx.fillStyle=cloth;
    ctx.beginPath();
    ctx.moveTo(j.sL.x-2*k,j.sL.y-3*k);
    ctx.quadraticCurveTo(j.chest.x,j.chest.y-10*k,j.sR.x+2*k,j.sR.y-3*k);
    ctx.lineTo(j.hipR.x+4*k,j.hipR.y+3*k);
    ctx.quadraticCurveTo(j.pelvis.x,j.pelvis.y+7*k,j.hipL.x-4*k,j.hipL.y+3*k);
    ctx.closePath(); ctx.fill();
    // rim light from the footlights: warm underside edge
    ctx.strokeStyle=U.rgba(pal[2]||'#d9a441',0.5); ctx.lineWidth=1.6*k;
    ctx.beginPath();
    ctx.moveTo(j.hipL.x-4*k,j.hipL.y+2*k);
    ctx.quadraticCurveTo(j.pelvis.x,j.pelvis.y+6*k,j.hipR.x+4*k,j.hipR.y+2*k);
    ctx.stroke();
    // near limbs
    line(j.sL,j.elbowL,6,wood); line(j.elbowL,j.wristL,5,wood);
    line(j.hipL,j.kneeL,7,wood); line(j.kneeL,j.ankleL,6,wood);
    // feet
    line(j.ankleL,{x:j.ankleL.x-6*k,y:j.ankleL.y+1.5*k},4,dark);
    line(j.ankleR,{x:j.ankleR.x+6*k,y:j.ankleR.y+1.5*k},4,dark);
    // hands: small wooden beads
    for(const w of [j.wristL,j.wristR]){ ctx.fillStyle=woodHi;
      ctx.beginPath(); ctx.arc(w.x,w.y,2.6*k,0,7); ctx.fill(); }
    // joint pins
    ctx.fillStyle=U.rgba('#100c08',0.8);
    for(const p of [j.elbowL,j.elbowR,j.kneeL,j.kneeR,j.sL,j.sR]){
      ctx.beginPath(); ctx.arc(p.x,p.y,1.7*k,0,7); ctx.fill(); }
    // head: turned wood, blank face
    const g=ctx.createRadialGradient(j.headC.x-j.headR*0.4,j.headC.y+j.headR*0.55,j.headR*0.2,
      j.headC.x,j.headC.y,j.headR*1.25);
    g.addColorStop(0,woodHi); g.addColorStop(0.7,wood); g.addColorStop(1,U.shade('#8a6a42',-0.4));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(j.headC.x,j.headC.y,j.headR*0.86,j.headR,0,0,7); ctx.fill();
    // warm rim under the chin (footlights)
    ctx.strokeStyle=U.rgba(pal[2]||'#d9a441',0.55); ctx.lineWidth=1.4*k;
    ctx.beginPath(); ctx.arc(j.headC.x,j.headC.y,j.headR*0.92,Math.PI*0.18,Math.PI*0.82); ctx.stroke();
    // nose notch, profile hint — vanishes when the face turns to you
    if(P.face<0.5){
      ctx.fillStyle=U.rgba('#100c08',0.5*(1-P.face*2));
      ctx.beginPath();
      ctx.moveTo(j.headC.x+j.headR*0.55,j.headC.y-j.headR*0.1);
      ctx.lineTo(j.headC.x+j.headR*0.82,j.headC.y+j.headR*0.06);
      ctx.lineTo(j.headC.x+j.headR*0.5,j.headC.y+j.headR*0.16);
      ctx.closePath(); ctx.fill();
    }
    // the face, when it finds you: two pinprick eyes
    if(P.face>0.03&&!Settings.d.noScare){
      const a=Math.min(1,P.face);
      ctx.fillStyle=U.rgba('#0a0605',0.9*a);
      for(const s of [-1,1]){ ctx.beginPath();
        ctx.ellipse(j.headC.x+s*j.headR*0.30,j.headC.y-j.headR*0.08,j.headR*0.075,j.headR*0.11,0,0,7);
        ctx.fill(); }
      ctx.fillStyle=U.rgba('#f5ead0',0.55*a);
      for(const s of [-1,1]){ ctx.beginPath();
        ctx.arc(j.headC.x+s*j.headR*0.30,j.headC.y-j.headR*0.10,j.headR*0.024,0,7); ctx.fill(); }
    }
    ctx.restore();
  },
};

/* ═══ MODULE: Stage — layered paper flats, footlights, upward shadows ═══
   Every static flat is pre-rendered once (paper grain + cardstock cut edge)
   to an offscreen canvas; per-frame work is compositing + dynamic light.
   The dominant light source is the footlight row at the stage lip, BELOW
   everything, so all shadows throw UPWARD onto the rearmost flat. */
const Stage = {
  grainTile:null, grainScreen:null, vignette:null, glowSprite:null, glowCol:null,
  grain(){
    if(this.grainTile) return this.grainTile;
    const c=document.createElement('canvas'); c.width=c.height=192;
    const x=c.getContext('2d'), im=x.createImageData(192,192);
    const r=U.rng(77);
    for(let i=0;i<im.data.length;i+=4){ const v=170+r()*85;
      im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; }
    x.putImageData(im,0,0);
    return this.grainTile=c;
  },
  /* full-screen caches rebuilt on resize — per-frame cost becomes 2 drawImages */
  screenCaches(){
    const w=Math.max(4,Math.ceil(L.W)), h=Math.max(4,Math.ceil(L.H));
    if(this.grainScreen&&this.grainScreen.width===w+192&&this.grainScreen.height===h+192) return;
    const gs=document.createElement('canvas'); gs.width=w+192; gs.height=h+192;
    const gx=gs.getContext('2d'); const t=this.grain();
    for(let y=0;y<gs.height;y+=192) for(let x=0;x<gs.width;x+=192) gx.drawImage(t,x,y);
    this.grainScreen=gs;
    const vg=document.createElement('canvas'); vg.width=w; vg.height=h;
    const vx=vg.getContext('2d');
    const v=vx.createRadialGradient(w/2,h*0.45,h*0.35,w/2,h*0.5,h*0.85);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.55)');
    vx.fillStyle=v; vx.fillRect(0,0,w,h);
    this.vignette=vg;
  },
  glow(col){
    if(this.glowSprite&&this.glowCol===col) return this.glowSprite;
    const c=document.createElement('canvas'); c.width=c.height=160;
    const x=c.getContext('2d');
    const g=x.createRadialGradient(80,80,2,80,80,80);
    g.addColorStop(0,U.rgba(col,0.55)); g.addColorStop(0.4,U.rgba(col,0.15)); g.addColorStop(1,U.rgba(col,0));
    x.fillStyle=g; x.beginPath(); x.arc(80,80,80,0,7); x.fill();
    this.glowCol=col; return this.glowSprite=c;
  },
  prepare(S){
    const c=S.chart;
    S.stageR={ flats:[], lights:[], flicker:0, dimPulse:-9 };
    for(const def of c.stage.flats){
      S.stageR.flats.push({ def, id:def.id, canvas:null,
        state:def.hidden?'out':'in', slide:def.hidden?1:0, dir:(this.centroid(def)<0.5?-1:1) });
    }
    this.rebuild(S);
    S.stageR.lights=(c.stage.footlights||[]).map(f=>({x:f.x,base:f.intensity??1,cur:f.intensity??1,flick:0}));
  },
  centroid(def){
    const cmds=U.parsePath(def.path||'M 0,0'); let sx=0,n=0;
    for(const cm of cmds){ if(cm.length>=3){ sx+=cm[cm.length-2]; n++; } }
    return n?sx/n:0.5;
  },
  rebuild(S){
    if(!S.stageR) return;
    const w=Math.max(4,Math.round(L.stageX1-L.stageX0)), h=Math.max(4,Math.round(L.lipY-L.stageTop));
    for(const f of S.stageR.flats){
      const cv=document.createElement('canvas'); cv.width=w+80; cv.height=h+8;
      const x=cv.getContext('2d');
      const pal=S.chart.stage.palette;
      const col=typeof f.def.fill==='number'? (pal[f.def.fill]||'#333') : (f.def.fill||'#333');
      const cmds=U.parsePath(f.def.path||'');
      U.tracePath(x,cmds,w,h,40,4);
      x.fillStyle=col; x.fill();
      // paper grain, clipped to the flat
      x.globalCompositeOperation='source-atop';
      x.globalAlpha=0.13;
      const g=this.grain();
      for(let gy=0; gy<cv.height; gy+=192) for(let gx=0; gx<cv.width; gx+=192) x.drawImage(g,gx,gy);
      x.globalAlpha=1;
      // cardstock cut edge: 2px lighter rim + faint dark inner line
      x.globalCompositeOperation='source-atop';
      U.tracePath(x,cmds,w,h,40,4);
      x.strokeStyle=U.rgba('#ffffff',0.16); x.lineWidth=2.4; x.stroke();
      U.tracePath(x,cmds,w,h,40,5.6);
      x.strokeStyle=U.rgba('#000000',0.22); x.lineWidth=1.2; x.stroke();
      x.globalCompositeOperation='source-over';
      f.canvas=cv;
    }
  },
  flatSwap(S,id,toId){
    const out=S.stageR.flats.find(f=>f.id===id&&f.state!=='out');
    const inc=S.stageR.flats.find(f=>f.id===toId);
    if(out){ out.state='leaving'; out.t0=S.now; }
    if(inc){ inc.state='entering'; inc.t0=S.now; }
  },
  update(S,dt){
    const R=S.stageR; if(!R) return;
    let moving=false;
    for(const f of R.flats){
      if(f.state==='leaving'){ f.slide=Math.min(1,(S.now-f.t0)/1.7); moving=true;
        if(f.slide>=1) f.state='out'; }
      else if(f.state==='entering'){ f.slide=Math.max(0,1-(S.now-f.t0)/1.7); moving=true;
        if(f.slide<=0) f.state='in'; }
    }
    // footlights: base intensity, chart-driven failure flicker, scare dips
    for(const l of R.lights){
      const n=Math.sin(S.now*13.7+l.x*40)*Math.sin(S.now*7.1+l.x*13);
      const flickAmt=R.flicker*(Settings.d.reduceFlash?0.35:1);
      const dip=this.dipAmount(S);
      l.cur=Math.max(0.05,(l.base+(n>0.72-flickAmt?-(0.5+0.4*Math.sin(S.now*53+l.x*99))*flickAmt:0))*(1-dip));
    }
    S.transitionActive = moving || this.dipAmount(S)>0.25 || S.fx.scareT>S.now-2;
  },
  dipAmount(S){
    const R=S.stageR;
    const age=S.now-R.dimPulse, dur=Settings.d.reduceFlash?0.9:0.30;
    if(age<0||age>dur) return 0;
    return Math.sin(Math.PI*age/dur)*0.85;
  },
  lightLevel(S){
    const R=S.stageR; if(!R||!R.lights.length) return 1;
    return R.lights.reduce((a,l)=>a+l.cur,0)/R.lights.length;
  },
  lightPos(S,l){ return {x:L.stageX0+(L.stageX1-L.stageX0)*l.x, y:L.lipY}; },
  drawFlats(S,ctx,which){
    const R=S.stageR;
    const cam=S.cross.tilt*10 + S.pup.lean*4;
    for(const f of R.flats){
      if(f.state==='out') continue;
      const par=f.def.parallax||0;
      const isBack=par<0.34;
      if(which==='back'? !isBack : isBack) continue;
      const slideX=f.dir*f.slide*(L.stageX1-L.stageX0)*1.05;
      const px=-cam*(1-par*0.85);
      ctx.drawImage(f.canvas, L.stageX0-40+px+slideX, L.stageTop-4);
    }
  },
  drawShadows(S,ctx){
    // cheap 2D projection of the puppet from each footlight onto the backdrop
    const R=S.stageR; if(!R.lights.length||!S.pup.j.headTop) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(L.stageX0,L.stageTop,L.stageX1-L.stageX0,L.lipY-L.stageTop); ctx.clip();
    const bones=Puppet.bones(S);
    const m=1.22+0.55*(1-S.depth);
    const k=S.pup.h/100;
    for(const light of R.lights.slice(0,3)){
      const lp=this.lightPos(S,light);
      const a=0.085*light.cur*(1-S.depth*0.35);
      if(a<0.01) continue;
      ctx.strokeStyle=`rgba(6,8,14,${a})`;
      ctx.lineCap='round';
      for(const [b1,b2,w] of bones){
        const p1={x:lp.x+(b1.x-lp.x)*m, y:lp.y+(b1.y-lp.y)*m};
        const p2={x:lp.x+(b2.x-lp.x)*m, y:lp.y+(b2.y-lp.y)*m};
        ctx.lineWidth=w*k*m*1.25;
        ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
      }
      // head shadow
      const j=S.pup.j;
      const hc={x:lp.x+(j.headC.x-lp.x)*m, y:lp.y+(j.headC.y-lp.y)*m};
      ctx.fillStyle=`rgba(6,8,14,${a})`;
      ctx.beginPath(); ctx.ellipse(hc.x,hc.y,j.headR*m*0.95,j.headR*m*1.05,0,0,7); ctx.fill();
    }
    ctx.restore();
  },
  drawFootlights(S,ctx){
    const R=S.stageR;
    // upward light cones behind the puppet were handled by shadows+rim; here: glows + hoods
    const warm=S.chart.stage.palette[2]||'#d9a441';
    const spr=this.glow(warm);
    for(const light of R.lights){
      const p=this.lightPos(S,light);
      const r=L.H*0.16*light.cur+1;
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=Math.min(1,light.cur);
      ctx.drawImage(spr,p.x-r,p.y-2-r,r*2,r*2);
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over';
      // brass hood
      ctx.fillStyle='#131015';
      ctx.beginPath(); ctx.moveTo(p.x-9,p.y+3); ctx.quadraticCurveTo(p.x,p.y-8,p.x+9,p.y+3); ctx.closePath(); ctx.fill();
      ctx.fillStyle=U.rgba(warm,0.9*light.cur);
      ctx.beginPath(); ctx.ellipse(p.x,p.y+0.5,3.4,1.6,0,0,7); ctx.fill();
    }
  },
};

/* ═══ MODULE: Audience — the silhouettes are keeping score ═══
   audienceUnease (0–1) rises with slack, twists and idleness. Behaviors
   unlock at thresholds and persist for the act. Nothing is ever announced:
   changes apply only during transitions or a brief dim of the houselights. */
const Audience = {
  reset(S,baseline){
    const r=U.rng(1234+Math.floor(baseline*100));
    S.aud={ heads:[], closeness:0, pending:[], applied:{}, lastChangeT:-99, row2:0 };
    S.unease=baseline;
    const n=7+Math.floor(baseline*6);
    for(let i=0;i<n;i++) this.addHead(S,r);
  },
  addHead(S,r){
    r=r||U.rng(S.aud.heads.length*31+7);
    const i=S.aud.heads.length;
    S.aud.heads.push({ u:(i%2? 0.5+((i+1)>>1)*0.105 : 0.5-((i+1)>>1)*0.105)+ (r()-0.5)*0.03,
      w:0.7+r()*0.5, ph:r()*7, standing:0, standT:0, face:0, row:(i>10?1:0) });
  },
  update(S,dt){
    const st=S.str;
    // ---- drivers ---------------------------------------------------------
    let d=0;
    const slackCount=st.lanes.filter(l=>l.slack).length;
    d+=slackCount*0.020;
    d+=Strings.totalTwists(S)*0.011;
    const idle=(S.now-Input.lastInputSongT>CFG.idleAfter)&&S.now>2&&this.notesNear(S);
    if(idle) d+=0.012;
    if(st.untangle.active) d+=0.022;
    d-=0.010; // slow forgiveness
    S.unease=U.clamp(S.unease+d*dt, S.baseUnease*0.6, 1);
    S.idleNow=idle;
    // ---- threshold behaviors queue up, then wait for cover ---------------
    const A=S.aud;
    const want=[];
    if(S.unease>0.25&&!A.applied.heads1) want.push('heads1');
    if(S.unease>0.5&&!A.applied.heads2) want.push('heads2');
    if(S.unease>0.65&&!A.applied.stand) want.push('stand');
    if(S.unease>0.85&&!A.applied.face) want.push('face');
    for(const w of want) if(!A.pending.includes(w)) A.pending.push(w);
    if(A.pending.length){
      if(S.transitionActive){ this.applyAll(S); }
      else if(S.now-A.lastChangeT>16&&S.now-S.stageR.dimPulse>20){ S.stageR.dimPulse=S.now; }
      if(Stage.dipAmount(S)>0.7) this.applyAll(S);
    }
    // rows creep toward the lip — slower than the eye, always in the periphery
    const targetClose=U.clamp((S.unease-0.4)*1.8,0,1);
    if(A.closeness<targetClose) A.closeness=Math.min(targetClose,A.closeness+dt*0.012);
    // standing/facing animate
    for(const h of A.heads){
      if(h.standing>0&&h.standing<1) h.standing=Math.min(1,h.standing+dt*0.5);
      if(h.faceGo&&h.face<1) h.face=Math.min(1,h.face+dt*0.4);
    }
  },
  notesNear(S){
    // resist notes don't count: stillness there is the correct play
    const c=S.chart, i=S.cuePtr||0;
    for(let k=Math.max(0,i-4);k<c.notes.length;k++){ const n=c.notes[k];
      if(n.t>S.now+3) break;
      if(n.type!=='resist'&&Math.abs(n.t-S.now)<2) return true; }
    return S.str.untangle.active;
  },
  applyAll(S){
    const A=S.aud;
    for(const w of A.pending) this.applyOne(S,w);
    A.pending=[]; A.lastChangeT=S.now;
  },
  applyOne(S,w){
    const A=S.aud; A.applied[w]=true;
    if(w==='heads1'){ this.addHead(S); this.addHead(S); }
    else if(w==='heads2'){ this.addHead(S); this.addHead(S); this.addHead(S); A.row2=1; }
    else if(w==='stand'){ const h=A.heads[3%A.heads.length]; if(h){h.standing=0.001; h.standT=S.now;} }
    else if(w==='face'){ A.heads.forEach((h,i)=>{ h.faceGo=true; h.face=Math.max(h.face,0.001*(1+i%3)); }); }
    else if(w==='calm'){ A.heads.forEach(h=>{h.faceGo=false;h.face=0;h.standing=0;}); A.applied={}; }
  },
  /* chart `audience` events use spec-style names */
  event(S,e){
    const set=e.set||'';
    if(set.startsWith('headCount')){ const n=parseInt(set.replace(/\D+/g,''),10)||1;
      S.aud.pending.push(...Array(Math.min(4,n)).fill('heads1')); }
    else if(set==='rowsCloser'){ S.aud.closeness=Math.min(1,S.aud.closeness+0.4); }
    else if(set==='onePersonStanding'){ S.aud.pending.push('stand'); }
    else if(set==='faceThePlayer'){ S.aud.pending.push('face'); }
    else if(set==='calm'){ this.applyOne(S,'calm'); S.unease=Math.max(S.baseUnease,S.unease*0.5); }
    if(typeof e.unease==='number') S.unease=U.clamp(S.unease+e.unease,0,1);
  },
  draw(ctx,S){
    const A=S.aud; if(!A) return;
    const w=L.W, top=L.audTop - A.closeness*L.H*0.022;
    // house darkness
    const g=ctx.createLinearGradient(0,top-L.H*0.05,0,L.H);
    g.addColorStop(0,'rgba(4,4,8,0)'); g.addColorStop(0.35,'rgba(4,4,8,0.9)'); g.addColorStop(1,'#020204');
    ctx.fillStyle=g; ctx.fillRect(0,top-L.H*0.05,w,L.H);
    const rows=[{y:top+L.H*0.075,s:1},{y:top+L.H*0.145,s:1.3}];
    if(A.row2<1) rows.pop();
    for(let ri=rows.length-1;ri>=0;ri--){
      for(const h of A.heads){
        if((h.row||0)!==ri&&ri<rows.length-1) continue;
        if((h.row||0)!==ri) continue;
        const row=rows[ri];
        const hw=L.H*0.030*h.w*row.s, hh=hw*1.24;
        const x=h.u*w + Math.sin(S.now*0.4+h.ph)*1.1;
        const breathe=Math.sin(S.now*0.55+h.ph)*L.H*0.0012;
        const stand=U.easeOut(h.standing)*L.H*0.085;
        const y=row.y+breathe-stand - A.closeness*L.H*0.03;
        ctx.fillStyle='#030307';
        // shoulders
        ctx.beginPath();
        ctx.moveTo(x-hw*2.1,L.H+2);
        ctx.quadraticCurveTo(x-hw*1.9,y+hh*0.9,x-hw*1.15,y+hh*0.72);
        ctx.quadraticCurveTo(x,y+hh*0.45,x+hw*1.15,y+hh*0.72);
        ctx.quadraticCurveTo(x+hw*1.9,y+hh*0.9,x+hw*2.1,L.H+2);
        ctx.closePath(); ctx.fill();
        // head: slight profile bump toward stage; facing you = symmetric, narrower
        const f=h.face;
        ctx.beginPath();
        ctx.ellipse(x,y,hw*(1-0.13*f),hh,0,0,7);
        ctx.fill();
        if(f<0.6){ ctx.beginPath(); ctx.ellipse(x+hw*0.72*(1-f),y+hh*0.1,hw*0.24*(1-f),hh*0.3,0,0,7); ctx.fill(); }
        if(h.standing>0.9){ // a standing figure blocks more of the stage
          ctx.fillRect(x-hw*1.0,y+hh*0.6,hw*2.0,L.H-(y+hh*0.6));
        }
      }
    }
  },
};

/* ═══ MODULE: Renderer — render is a pure function of state ═══
   Draw order (back→front): backdrop flats, upward shadows, mid flats,
   puppet, strings+pulses+cues, footlight glow, stage lip, house dimming,
   proscenium, audience, surtitles, crossbar+hands, HUD, fx, grain. */
const Renderer = {
  cv:null, ctx:null,
  init(){ this.cv=document.getElementById('cv'); this.ctx=this.cv.getContext('2d'); },
  resize(){
    const dpr=Math.min(1.5,devicePixelRatio||1);
    this.cv.width=Math.round(innerWidth*dpr); this.cv.height=Math.round(innerHeight*dpr);
